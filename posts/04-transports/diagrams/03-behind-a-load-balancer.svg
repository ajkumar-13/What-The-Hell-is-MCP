<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">Streamable HTTP behind a round-robin load balancer</title>
  <desc id="d">One client sends three requests to a plain round-robin load balancer, which forwards them to three identical server replicas, one request each. A panel at the bottom left shows the three headers a balancer can route on without parsing the body: protocol version, method, and name. A panel at the bottom right shows the session identifier header struck through, because it was removed in revision 2026-07-28 and there is therefore no state to route a client back to.</desc>

  <style><![CDATA[
    :root{--mcp-bg:#FAFAF7;--mcp-surface:#FFFDF9;--mcp-ink:#1A1A1A;--mcp-ink-muted:#5C5C5C;--mcp-ink-subtle:#9A9A9A;--mcp-border:#D9D9D4;--mcp-primary:#5B7FBF;--mcp-accent:#D98E5F;--mcp-success:#5C9E78;--mcp-warn:#B8895A;--mcp-alert:#C66B5E;--mcp-neutral-1:#EAEAE4;--mcp-on-fill:#FFFDF9;}
    @media (prefers-color-scheme:dark){:root{--mcp-bg:#0E0F12;--mcp-surface:#16181C;--mcp-ink:#F2F2EE;--mcp-ink-muted:#B4B4AE;--mcp-ink-subtle:#6E6E68;--mcp-border:#2A2D33;--mcp-primary:#8BA8E0;--mcp-accent:#E8B088;--mcp-success:#7FBF9B;--mcp-warn:#D4B58A;--mcp-alert:#D88880;--mcp-neutral-1:#1F2229;--mcp-on-fill:#14161A;}}
    .bg{fill:var(--mcp-bg);}
    .title{font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:20px;fill:var(--mcp-ink);}
    .label{font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:13px;fill:var(--mcp-ink);}
    .small{font-family:Inter,system-ui,sans-serif;font-weight:400;font-size:12px;fill:var(--mcp-ink-muted);}
    .mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-weight:400;font-size:11.5px;fill:var(--mcp-ink);}
    .monodim{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-weight:400;font-size:11.5px;fill:var(--mcp-ink-subtle);}
    .chip{fill:var(--mcp-surface);stroke:var(--mcp-border);stroke-width:1;}
    .box{fill:var(--mcp-surface);stroke:var(--mcp-ink);stroke-width:1.5;}
    .srv{fill:var(--mcp-surface);stroke:var(--mcp-accent);stroke-width:1.5;}
    .client{fill:var(--mcp-primary);}
    .onfill{font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:13px;fill:var(--mcp-on-fill);}
    .flow{stroke:var(--mcp-ink);stroke-width:1.5;fill:none;}
    .ok{stroke:var(--mcp-success);stroke-width:1.5;fill:none;}
    .strike{stroke:var(--mcp-alert);stroke-width:1.5;}
  ]]></style>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--mcp-ink)"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--mcp-success)"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="540"/>
  <text class="title" x="40" y="42">Round robin works because there is nothing left to pin</text>

  <rect class="client" x="40" y="176" width="130" height="60" rx="8"/>
  <text class="onfill" x="105" y="204" text-anchor="middle">client</text>
  <text class="onfill" x="105" y="222" text-anchor="middle">3 requests</text>

  <path class="flow" d="M170,206 L286,206" marker-end="url(#ar)"/>

  <rect class="box" x="290" y="176" width="170" height="60" rx="8"/>
  <text class="label" x="375" y="202" text-anchor="middle">load balancer</text>
  <text class="small" x="375" y="222" text-anchor="middle">round robin, no affinity</text>

  <path class="ok" d="M460,200 L596,131" marker-end="url(#arG)"/>
  <path class="ok" d="M460,206 L596,209" marker-end="url(#arG)"/>
  <path class="ok" d="M460,214 L596,289" marker-end="url(#arG)"/>

  <rect class="srv" x="600" y="102" width="190" height="58" rx="8"/>
  <text class="label" x="695" y="126" text-anchor="middle">replica 1</text>
  <text class="small" x="695" y="146" text-anchor="middle">answers request 1</text>

  <rect class="srv" x="600" y="182" width="190" height="58" rx="8"/>
  <text class="label" x="695" y="206" text-anchor="middle">replica 2</text>
  <text class="small" x="695" y="226" text-anchor="middle">answers request 2</text>

  <rect class="srv" x="600" y="262" width="190" height="58" rx="8"/>
  <text class="label" x="695" y="286" text-anchor="middle">replica 3</text>
  <text class="small" x="695" y="306" text-anchor="middle">answers request 3</text>

  <text class="small" x="695" y="342" text-anchor="middle">identical processes, nothing shared between them</text>

  <text class="small" x="40"  y="392">Everything the balancer needs in order to route is in the headers.</text>
  <rect class="chip" x="40" y="402" width="490" height="94" rx="6"/>
  <text class="mono" x="56" y="430">MCP-Protocol-Version: 2026-07-28</text>
  <text class="mono" x="56" y="454">Mcp-Method: tools/call</text>
  <text class="mono" x="56" y="478">Mcp-Name: get_weather</text>

  <text class="small" x="560" y="392">What is not in them any more.</text>
  <rect class="chip" x="560" y="402" width="360" height="94" rx="6"/>
  <text class="mono" x="576" y="430">Mcp-Session-Id: a91f</text>
  <line class="strike" x1="572" y1="426" x2="712" y2="426"/>
  <text class="small" x="576" y="456">Removed by SEP-2567. A modern server</text>
  <text class="small" x="576" y="478">ignores it and mints nothing in reply.</text>

  <text class="monodim" x="40" y="524">No session id, no handshake, and no in-flight state between requests. Any replica can answer anything.</text>
</svg>
