<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">One client, a round-robin balancer, and three interchangeable replicas</title>
  <desc id="d">A client sending three requests points at a load balancer marked round robin, no affinity, which fans out to three identical replicas, each answering one of the three requests, with a note that the replicas share nothing. Below, two panels. The left one lists the three headers a balancer can route on without parsing the body: the protocol version, the method, and the tool name. The right one shows an Mcp-Session-Id header struck through, noting that SEP-2567 removed it and a modern server ignores it and mints nothing in reply. A closing line says any replica can answer anything, so a failed replica costs one retry rather than a conversation.</desc>

