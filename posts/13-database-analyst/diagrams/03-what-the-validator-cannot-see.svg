<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">Two ways a SQL validator returns a clean pass on something you did not want</title>
  <desc id="d">Two panels side by side. The left panel shows a statement selecting every email address and full name from the users table with a limit of one thousand rows. All six validator checks are ticked, the statement is allowed, and a thousand rows of personal data are returned. The caption notes that nothing here is a bug, because a parser has no concept of sensitive and column policy belongs in the database. The right panel shows a DO block calling pg_sleep for thirty seconds. sqlglot cannot model the syntax, logs a warning to standard error, and returns an opaque Command node whose only child is a string literal. Every check then walks a tree containing no function node, no delete node and no limit node, so each check runs, finds nothing and passes. Two endings are drawn: trusting the parse waves the statement through, while this server refuses any opaque node on sight.</desc>

  <style><![CDATA[
    :root{--mcp-bg:#FAFAF7;--mcp-surface:#FFFDF9;--mcp-ink:#1A1A1A;--mcp-ink-muted:#5C5C5C;--mcp-ink-subtle:#9A9A9A;--mcp-border:#D9D9D4;--mcp-primary:#5B7FBF;--mcp-accent:#D98E5F;--mcp-success:#5C9E78;--mcp-warn:#B8895A;--mcp-alert:#C66B5E;--mcp-neutral-1:#EAEAE4;--mcp-neutral-2:#CFCFC8;--mcp-on-fill:#FFFDF9;}
    @media (prefers-color-scheme:dark){:root{--mcp-bg:#0E0F12;--mcp-surface:#16181C;--mcp-ink:#F2F2EE;--mcp-ink-muted:#B4B4AE;--mcp-ink-subtle:#6E6E68;--mcp-border:#2A2D33;--mcp-primary:#8BA8E0;--mcp-accent:#E8B088;--mcp-success:#7FBF9B;--mcp-warn:#D4B58A;--mcp-alert:#D88880;--mcp-neutral-1:#1F2229;--mcp-neutral-2:#2C3038;--mcp-on-fill:#14161A;}}
    .bg{fill:var(--mcp-bg);}
    .title{font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:20px;fill:var(--mcp-ink);}
    .sub{font-family:Inter,system-ui,sans-serif;font-weight:400;font-size:12px;fill:var(--mcp-ink-muted);}
    .phead{font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:15px;fill:var(--mcp-ink);}
    .psub{font-family:Inter,system-ui,sans-serif;font-weight:400;font-size:12px;fill:var(--mcp-ink-muted);}
    .label{font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:12.5px;fill:var(--mcp-ink);}
    .small{font-family:Inter,system-ui,sans-serif;font-weight:400;font-size:11.5px;fill:var(--mcp-ink-muted);}
    .item{font-family:Inter,system-ui,sans-serif;font-weight:400;font-size:11.5px;fill:var(--mcp-ink);}
    .mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-weight:400;font-size:11px;fill:var(--mcp-ink);}
    .monos{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-weight:400;font-size:10px;fill:var(--mcp-ink-muted);}
    .panel{fill:var(--mcp-surface);stroke:var(--mcp-border);stroke-width:1;}
    .box{fill:var(--mcp-bg);stroke:var(--mcp-ink);stroke-width:1.5;}
    .softbox{fill:var(--mcp-bg);stroke:var(--mcp-border);stroke-width:1;}
    .warnbar{fill:var(--mcp-warn);}
    .badbar{fill:var(--mcp-alert);}
    .okbar{fill:var(--mcp-success);}
    .tick{stroke:var(--mcp-success);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}
    .cross{stroke:var(--mcp-alert);stroke-width:1.5;fill:none;stroke-linecap:round;}
    .dash{stroke:var(--mcp-ink-subtle);stroke-width:1.5;fill:none;stroke-linecap:round;}
    .rule{stroke:var(--mcp-border);stroke-width:0.75;fill:none;}
  ]]></style>

  <rect class="bg" width="960" height="540"/>

  <text class="title" x="34" y="34">Two clean passes you did not want</text>
  <text class="sub" x="34" y="56">Left: the checks all ran and all passed. Right: the checks all passed because none of them could run.</text>

  <rect class="panel" x="34" y="80" width="436" height="398" rx="6"/>
  <rect class="panel" x="490" y="80" width="436" height="398" rx="6"/>

  <!-- ================= LEFT PANEL ================= -->
  <text class="phead" x="50" y="106">Case A · Every check passes</text>
  <text class="psub" x="50" y="124">and the query is a data breach</text>

  <rect class="box" x="50" y="136" width="404" height="34" rx="4"/>
  <text class="mono" x="64" y="158">SELECT email, full_name FROM users LIMIT 1000</text>

  <g class="tick"><path d="M56,190 l4,4 l8,-9"/></g>
  <text class="item" x="78" y="194">one statement only</text>
  <g class="tick"><path d="M56,214 l4,4 l8,-9"/></g>
  <text class="item" x="78" y="218">the root is a Select</text>
  <g class="tick"><path d="M56,238 l4,4 l8,-9"/></g>
  <text class="item" x="78" y="242">no mutation node below the root</text>
  <g class="tick"><path d="M56,262 l4,4 l8,-9"/></g>
  <text class="item" x="78" y="266">no SELECT ... INTO</text>
  <g class="tick"><path d="M56,286 l4,4 l8,-9"/></g>
  <text class="item" x="78" y="290">no name from the 16-entry blocklist</text>
  <g class="tick"><path d="M56,310 l4,4 l8,-9"/></g>
  <text class="item" x="78" y="314">LIMIT present, and within the ceiling</text>

  <line class="rule" x1="50" y1="328" x2="454" y2="328"/>

  <rect class="softbox" x="50" y="340" width="404" height="52" rx="4"/>
  <rect class="okbar" x="50" y="340" width="5" height="52"/>
  <text class="label" x="68" y="362">Allowed</text>
  <text class="monos" x="68" y="380">row_count: 1000 · columns: ["email", "full_name"]</text>

  <text class="small" x="50" y="414">Nothing here is a bug. The validator has no concept of</text>
  <text class="small" x="50" y="430">"sensitive", and this is indistinguishable from legitimate</text>
  <text class="small" x="50" y="446">analytics. The answer is a restricted view, row-level</text>
  <text class="small" x="50" y="462">security, or a role that cannot see the column.</text>

  <!-- ================= RIGHT PANEL ================= -->
  <text class="phead" x="506" y="106">Case B · No check passes</text>
  <text class="psub" x="506" y="124">because not one of them could run</text>

  <rect class="box" x="506" y="136" width="404" height="34" rx="4"/>
  <text class="mono" x="520" y="158">DO $$ BEGIN PERFORM pg_sleep(30); END $$</text>

  <rect class="softbox" x="506" y="180" width="404" height="46" rx="4"/>
  <rect class="warnbar" x="506" y="180" width="5" height="46"/>
  <text class="small" x="524" y="199">sqlglot does not raise. It logs to stderr and carries on:</text>
  <text class="monos" x="524" y="216">Falling back to parsing as a 'Command'.</text>

  <rect class="softbox" x="506" y="236" width="404" height="44" rx="4"/>
  <text class="monos" x="520" y="255">Command(this=DO, expression=Literal(...))</text>
  <text class="monos" x="520" y="271">walk types: ['Command', 'Literal']</text>

  <rect class="softbox" x="506" y="290" width="404" height="62" rx="4"/>
  <g class="dash"><path d="M520,308 l12,0"/></g>
  <g class="dash"><path d="M520,320 l12,0"/></g>
  <g class="dash"><path d="M520,332 l12,0"/></g>
  <text class="item" x="544" y="311">No Func node, no Delete node, no Limit node.</text>
  <text class="small" x="544" y="326">All six checks walk the tree, so all six ran,</text>
  <text class="small" x="544" y="341">found nothing, and returned cleanly.</text>

  <rect class="softbox" x="506" y="362" width="196" height="66" rx="4"/>
  <rect class="badbar" x="506" y="362" width="5" height="66"/>
  <g class="cross"><path d="M522,382 L532,392"/><path d="M532,382 L522,392"/></g>
  <text class="label" x="544" y="391">Trust the parse</text>
  <text class="small" x="522" y="410">Waved through, and</text>
  <text class="small" x="522" y="424">pg_sleep(30) runs.</text>

  <rect class="softbox" x="714" y="362" width="196" height="66" rx="4"/>
  <rect class="okbar" x="714" y="362" width="5" height="66"/>
  <g class="tick"><path d="M730,387 l4,4 l8,-9"/></g>
  <text class="label" x="752" y="391">This server</text>
  <text class="monos" x="730" y="410">isinstance(node,</text>
  <text class="monos" x="730" y="424">exp.Command) -&gt; refuse</text>

  <text class="small" x="506" y="452">An opaque node is a node no check can see inside. Refusing it</text>
  <text class="small" x="506" y="468">means valid PostgreSQL gets rejected, and that is the right trade.</text>

  <line class="rule" x1="34" y1="496" x2="926" y2="496"/>
  <text class="sub" x="34" y="518">The rule generalizes past sqlglot: when a parser degrades instead of failing, every check downstream of it degrades silently with it.</text>
</svg>
