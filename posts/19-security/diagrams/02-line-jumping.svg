<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">Line jumping on a timeline: the payload lands at tools/list</title>
  <desc id="d">A left-to-right timeline of one session across two lanes, the host with its client above and the server below. Step one, the client connects. Step two, the client sends tools/list. Step three, the server returns tool descriptions. Step four, those descriptions enter the model's context window, and from this point a hatched bar runs to the right edge marking the payload as resident in context. Step five, the user asks a question and the model picks a tool. Step six, the approval prompt is shown and only then is tools/call sent. A short second bar under step six shows how little of the timeline the approval prompt can see, and a brace marks the gap between the moment the payload becomes active and the moment the human is first asked anything. A note records that no message in the sequence is malformed and that the injecting server's own tool is never called, so it never appears in the interaction log.</desc>

  <style><![CDATA[
    :root{--mcp-bg:#FAFAF7;--mcp-surface:#FFFDF9;--mcp-ink:#1A1A1A;--mcp-ink-muted:#5C5C5C;--mcp-ink-subtle:#9A9A9A;--mcp-border:#D9D9D4;--mcp-primary:#5B7FBF;--mcp-accent:#D98E5F;--mcp-success:#5C9E78;--mcp-warn:#B8895A;--mcp-alert:#C66B5E;--mcp-neutral-1:#EAEAE4;--mcp-neutral-2:#CFCFC8;--mcp-on-fill:#FFFDF9;}
    @media (prefers-color-scheme:dark){:root{--mcp-bg:#0E0F12;--mcp-surface:#16181C;--mcp-ink:#F2F2EE;--mcp-ink-muted:#B4B4AE;--mcp-ink-subtle:#6E6E68;--mcp-border:#2A2D33;--mcp-primary:#8BA8E0;--mcp-accent:#E8B088;--mcp-success:#7FBF9B;--mcp-warn:#D4B58A;--mcp-alert:#D88880;--mcp-neutral-1:#1F2229;--mcp-neutral-2:#2C3038;--mcp-on-fill:#14161A;}}
    .bg{fill:var(--mcp-bg);}
    .title{font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:20px;fill:var(--mcp-ink);}
    .sub{font-family:Inter,system-ui,sans-serif;font-weight:400;font-size:12px;fill:var(--mcp-ink-muted);}
    .label{font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:12px;fill:var(--mcp-ink);}
    .small{font-family:Inter,system-ui,sans-serif;font-weight:400;font-size:11px;fill:var(--mcp-ink);}
    .muted{font-family:Inter,system-ui,sans-serif;font-weight:400;font-size:12px;fill:var(--mcp-ink-muted);}
    .tiny{font-family:Inter,system-ui,sans-serif;font-weight:400;font-size:10px;fill:var(--mcp-ink-subtle);}
    .mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-weight:400;font-size:11px;fill:var(--mcp-ink);}
    .lane{fill:var(--mcp-surface);stroke:var(--mcp-border);stroke-width:1;}
    .cbox{fill:var(--mcp-surface);stroke:var(--mcp-primary);stroke-width:1.5;}
    .sbox{fill:var(--mcp-surface);stroke:var(--mcp-accent);stroke-width:1.5;}
    .keybox{fill:var(--mcp-surface);stroke:var(--mcp-ink);stroke-width:1.5;}
    .zone{fill:var(--mcp-surface);stroke:var(--mcp-border);stroke-width:1;}
    .flow{stroke:var(--mcp-ink);stroke-width:1.5;fill:none;}
    .flow-thin{stroke:var(--mcp-ink-muted);stroke-width:1;fill:none;}
    .bound{stroke:var(--mcp-ink);stroke-width:1;fill:none;stroke-dasharray:5 4;}
    .mark{fill:var(--mcp-ink);stroke:var(--mcp-bg);stroke-width:1.5;}
    .marknum{font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:11px;fill:var(--mcp-on-fill);}
    .barA{fill:url(#hatch);stroke:var(--mcp-ink);stroke-width:1.5;}
    .barB{fill:var(--mcp-neutral-1);stroke:var(--mcp-ink);stroke-width:1.5;}
  ]]></style>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--mcp-ink)"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="var(--mcp-surface)"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="var(--mcp-ink-muted)" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect class="bg" width="960" height="540"/>

  <text class="title" x="32" y="32">Line jumping: the payload lands at tools/list</text>
  <text class="sub" x="32" y="52">Time runs left to right. Step 6 is the only point at which a human is asked anything.</text>

  <text class="label" x="32" y="118">host</text>
  <text class="label" x="32" y="134">and client</text>
  <text class="label" x="32" y="203">server</text>

  <rect class="lane" x="126" y="86" width="800" height="68" rx="6"/>
  <rect class="lane" x="126" y="164" width="800" height="68" rx="6"/>

  <!-- step 1 -->
  <rect class="cbox" x="126" y="96" width="120" height="48" rx="5"/>
  <text class="small" x="186" y="118" text-anchor="middle">client connects</text>
  <text class="small" x="186" y="134" text-anchor="middle">to the server</text>
  <line class="flow-thin" x1="186" y1="144" x2="186" y2="253"/>

  <!-- step 2 -->
  <rect class="cbox" x="262" y="96" width="120" height="48" rx="5"/>
  <text class="mono" x="322" y="118" text-anchor="middle">tools/list</text>
  <text class="small" x="322" y="134" text-anchor="middle">is sent</text>
  <line class="flow-thin" x1="322" y1="144" x2="322" y2="253"/>

  <!-- step 3 (server lane) -->
  <rect class="sbox" x="398" y="174" width="120" height="48" rx="5"/>
  <text class="small" x="458" y="196" text-anchor="middle">tool descriptions</text>
  <text class="small" x="458" y="212" text-anchor="middle">returned</text>
  <line class="flow-thin" x1="458" y1="222" x2="458" y2="253"/>

  <!-- step 4, the key moment -->
  <rect class="keybox" x="534" y="96" width="120" height="48" rx="5"/>
  <text class="small" x="594" y="118" text-anchor="middle">descriptions enter</text>
  <text class="small" x="594" y="134" text-anchor="middle">the model context</text>
  <line class="flow-thin" x1="594" y1="144" x2="594" y2="253"/>

  <!-- step 5 -->
  <rect class="cbox" x="670" y="96" width="120" height="48" rx="5"/>
  <text class="small" x="730" y="118" text-anchor="middle">user asks;</text>
  <text class="small" x="730" y="134" text-anchor="middle">model picks a tool</text>
  <line class="flow-thin" x1="730" y1="144" x2="730" y2="253"/>

  <!-- step 6 -->
  <rect class="keybox" x="806" y="96" width="120" height="48" rx="5"/>
  <text class="small" x="866" y="118" text-anchor="middle">approval prompt,</text>
  <text class="small" x="866" y="134" text-anchor="middle">then tools/call</text>
  <line class="flow-thin" x1="866" y1="144" x2="866" y2="253"/>

  <!-- axis -->
  <line class="flow" x1="126" y1="262" x2="936" y2="262" marker-end="url(#ar)"/>
  <text class="tiny" x="936" y="252" text-anchor="end">time</text>

  <circle class="mark" cx="186" cy="262" r="10"/><text class="marknum" x="186" y="266" text-anchor="middle">1</text>
  <circle class="mark" cx="322" cy="262" r="10"/><text class="marknum" x="322" y="266" text-anchor="middle">2</text>
  <circle class="mark" cx="458" cy="262" r="10"/><text class="marknum" x="458" y="266" text-anchor="middle">3</text>
  <circle class="mark" cx="594" cy="262" r="10"/><text class="marknum" x="594" y="266" text-anchor="middle">4</text>
  <circle class="mark" cx="730" cy="262" r="10"/><text class="marknum" x="730" y="266" text-anchor="middle">5</text>
  <circle class="mark" cx="866" cy="262" r="10"/><text class="marknum" x="866" y="266" text-anchor="middle">6</text>

  <!-- the two spans -->
  <line class="bound" x1="594" y1="272" x2="594" y2="384"/>
  <line class="bound" x1="866" y1="272" x2="866" y2="384"/>

  <rect class="barA" x="594" y="288" width="332" height="26" rx="4"/>
  <text class="label" x="606" y="305">payload resident in the model context</text>

  <rect class="barB" x="866" y="326" width="60" height="26" rx="4"/>
  <text class="muted" x="856" y="343" text-anchor="end">the approval prompt sees only this</text>

  <path class="flow-thin" d="M594,372 v8 h272 v-8"/>
  <text class="muted" x="730" y="400" text-anchor="middle">the gap: two steps, and unbounded wall-clock time</text>

  <rect class="zone" x="126" y="420" width="800" height="86" rx="6"/>
  <text class="small" x="146" y="446">Nothing in this sequence is malformed. Every message validates, and a conformance suite passes all of it.</text>
  <text class="small" x="146" y="468">The injecting server's own tool is never called, so it never appears in the interaction log.</text>
  <text class="small" x="146" y="490">Trail of Bits, 2025: the attack runs before any tool is invoked, which is what puts it upstream of every gate.</text>
</svg>
