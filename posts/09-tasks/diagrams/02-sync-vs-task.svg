<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">A synchronous call against a task, on the same timeline</title>
  <desc id="d">Two timelines of equal length, drawn against axes that start and end at the same points. The upper one, labelled synchronous, is a single wide bar running the whole width: one tools/call held open until it answers resultType complete, with a warning that a proxy timeout, a deploy or a dropped connection inside that window loses the work. The lower one, labelled as a task, is the same job split into short exchanges: a create that mints a taskId, five short tasks/get polls spaced one every pollIntervalMs, and a final short exchange returning status completed. Both rows finish at the same tick, so the difference is not speed but who holds the connection. A closing line notes that each exchange is short and self-contained, so any of them may be answered by a different replica.</desc>

