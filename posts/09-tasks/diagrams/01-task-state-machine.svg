<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">The task lifecycle, and the method behind each transition</title>
  <desc id="d">A state machine with five states. On the left a client tools/call, answered with a result tagged resultType task at the server's own discretion, points into a dashed box labelled non-terminal holding two states: working, where the server is doing the job, and input_required, whose inputRequests ride on tasks/get. A matched pair of arrows runs between them, the server moving down when it needs an answer and tasks/update moving back up. A single vertical rail down the right edge of the dashed box carries three arrows out to the terminal states: completed when the work ends, failed on a protocol fault, and cancelled on a tasks/cancel request, which is requested and never guaranteed. The rail spans the whole box because either non-terminal state may take any of the three exits. A closing note says the three terminal states are immutable, that a tool result with isError true still lands in completed with the error inside the result rather than in the status, and that failed is reserved for JSON-RPC faults.</desc>

