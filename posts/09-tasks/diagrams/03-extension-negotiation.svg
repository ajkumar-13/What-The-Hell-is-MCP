<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">The client declares the tasks extension; the server decides per request</title>
  <desc id="d">On the left a client box sits above a card holding the one block it repeats on every request: a _meta object carrying io.modelcontextprotocol/clientCapabilities, an extensions map, and io.modelcontextprotocol/tasks set to an empty object. Two arrows labelled request A and request B carry that identical block to the server on the right, which answers one with resultType complete, a CallToolResult because the job was quick, and the other with resultType task, a CreateTaskResult with a taskId. Underneath, a panel headed What is not here shows a tools/list entry whose execution taskSupport field is struck through, noted as removed by SEP-2663 with zero occurrences in the 2026-07-28 schema, and states that there is no per-tool declaration and no per-request opt-in flag. A closing line says a server must not return a task to a client that did not declare the extension on that request, regardless of prior declarations.</desc>

