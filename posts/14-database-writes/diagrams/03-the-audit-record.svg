<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">One audit row, field by field, with the provenance of every value</title>
  <desc id="d">The eleven columns of the mcp_audit_log table are listed one per line with their type, a sentence saying where the value comes from, and a labelled source tag. Four values come from PostgreSQL itself: the serial identifier, the timestamp from now, the affected row count read off the command tag, and the error message. Three come from the parse tree: the operation name, the target table, and the regenerated statement text with comments stripped. One is typed by the human who approved the write. Two come from the operator's environment and are explicitly not authenticated identities. One is the server's own control flow. A closing note observes that the model authored the semantics of exactly one field, the statement, and that a person read that exact string before it ran.</desc>

  <style><![CDATA[
    :root{--mcp-bg:#FAFAF7;--mcp-surface:#FFFDF9;--mcp-ink:#1A1A1A;--mcp-ink-muted:#5C5C5C;--mcp-ink-subtle:#9A9A9A;--mcp-border:#D9D9D4;--mcp-primary:#5B7FBF;--mcp-accent:#D98E5F;--mcp-success:#5C9E78;--mcp-warn:#B8895A;--mcp-alert:#C66B5E;--mcp-neutral-1:#EAEAE4;--mcp-neutral-2:#CFCFC8;--mcp-on-fill:#FFFDF9;}
    @media (prefers-color-scheme:dark){:root{--mcp-bg:#0E0F12;--mcp-surface:#16181C;--mcp-ink:#F2F2EE;--mcp-ink-muted:#B4B4AE;--mcp-ink-subtle:#6E6E68;--mcp-border:#2A2D33;--mcp-primary:#8BA8E0;--mcp-accent:#E8B088;--mcp-success:#7FBF9B;--mcp-warn:#D4B58A;--mcp-alert:#D88880;--mcp-neutral-1:#1F2229;--mcp-neutral-2:#2C3038;--mcp-on-fill:#14161A;}}
    .bg{fill:var(--mcp-bg);}
    .title{font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:20px;fill:var(--mcp-ink);}
    .sub{font-family:Inter,system-ui,sans-serif;font-weight:400;font-size:12px;fill:var(--mcp-ink-muted);}
    .colhead{font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:10.5px;fill:var(--mcp-ink-subtle);letter-spacing:0.4px;}
    .cell{font-family:Inter,system-ui,sans-serif;font-weight:400;font-size:11.5px;fill:var(--mcp-ink);}
    .type{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-weight:400;font-size:10px;fill:var(--mcp-ink-muted);}
    .field{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-weight:400;font-size:11.5px;fill:var(--mcp-ink);}
    .mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-weight:400;font-size:11px;fill:var(--mcp-ink);}
    .tag{font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:10px;fill:var(--mcp-ink);}
    .tagon{font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:10px;fill:var(--mcp-on-fill);}
    .zebra{fill:var(--mcp-neutral-1);}
    .tdb{fill:var(--mcp-success);stroke:var(--mcp-ink);stroke-width:1;}
    .ttree{fill:var(--mcp-accent);stroke:var(--mcp-ink);stroke-width:1;}
    .thuman{fill:var(--mcp-primary);stroke:var(--mcp-ink);stroke-width:1;}
    .tsrv{fill:var(--mcp-neutral-2);stroke:var(--mcp-border);stroke-width:1;}
    .tenv{fill:var(--mcp-surface);stroke:var(--mcp-border);stroke-width:1;}
    .rule{stroke:var(--mcp-border);stroke-width:0.75;fill:none;}
    .callout{fill:var(--mcp-surface);stroke:var(--mcp-ink);stroke-width:1.5;}
    .barhuman{fill:var(--mcp-primary);}
  ]]></style>

  <rect class="bg" width="960" height="540"/>

  <text class="title" x="34" y="32">One audit row, and where each value came from</text>
  <text class="sub" x="34" y="52">The table is written by mcp_writer. It is read through the read-only role, and it is not exposed as a tool the model can edit.</text>
  <text class="mono" x="34" y="80">INSERT INTO mcp_audit_log (...) VALUES ($1 ... $9) RETURNING id</text>

  <text class="colhead" x="48" y="120">FIELD</text>
  <text class="colhead" x="180" y="120">TYPE</text>
  <text class="colhead" x="300" y="120">WHERE THE VALUE COMES FROM</text>
  <text class="colhead" x="856" y="120" text-anchor="middle">SOURCE</text>
  <line class="rule" x1="34" y1="128" x2="926" y2="128"/>

  <!-- row 1 -->
  <rect class="zebra" x="34" y="136" width="892" height="26"/>
  <text class="field" x="48" y="154">id</text>
  <text class="type" x="180" y="154">BIGSERIAL PK</text>
  <text class="cell" x="300" y="154">Assigned by PostgreSQL on insert.</text>
  <rect class="tdb" x="800" y="141" width="112" height="17" rx="8"/>
  <text class="tagon" x="856" y="153.5" text-anchor="middle">database</text>

  <!-- row 2 -->
  <text class="field" x="48" y="182">occurred_at</text>
  <text class="type" x="180" y="182">TIMESTAMPTZ</text>
  <text class="cell" x="300" y="182">DEFAULT now(). The server's clock is never consulted.</text>
  <rect class="tdb" x="800" y="169" width="112" height="17" rx="8"/>
  <text class="tagon" x="856" y="181.5" text-anchor="middle">database</text>

  <!-- row 3 -->
  <rect class="zebra" x="34" y="192" width="892" height="26"/>
  <text class="field" x="48" y="210">operation</text>
  <text class="type" x="180" y="210">TEXT</text>
  <text class="cell" x="300" y="210">The root node type of the parse tree, not a keyword match.</text>
  <rect class="ttree" x="800" y="197" width="112" height="17" rx="8"/>
  <text class="tagon" x="856" y="209.5" text-anchor="middle">parse tree</text>

  <!-- row 4 -->
  <text class="field" x="48" y="238">target_table</text>
  <text class="type" x="180" y="238">TEXT</text>
  <text class="cell" x="300" y="238">The Table node the write is aimed at.</text>
  <rect class="ttree" x="800" y="225" width="112" height="17" rx="8"/>
  <text class="tagon" x="856" y="237.5" text-anchor="middle">parse tree</text>

  <!-- row 5 -->
  <rect class="zebra" x="34" y="248" width="892" height="26"/>
  <text class="field" x="48" y="266">sql_text</text>
  <text class="type" x="180" y="266">TEXT</text>
  <text class="cell" x="300" y="266">plan.sql, regenerated with comments=False. The exact string the human read.</text>
  <rect class="ttree" x="800" y="253" width="112" height="17" rx="8"/>
  <text class="tagon" x="856" y="265.5" text-anchor="middle">parse tree</text>

  <!-- row 6 -->
  <text class="field" x="48" y="294">affected_rows</text>
  <text class="type" x="180" y="294">INTEGER</text>
  <text class="cell" x="300" y="294">The last field of PostgreSQL's command tag, such as DELETE 2.</text>
  <rect class="tdb" x="800" y="281" width="112" height="17" rx="8"/>
  <text class="tagon" x="856" y="293.5" text-anchor="middle">database</text>

  <!-- row 7 -->
  <rect class="zebra" x="34" y="304" width="892" height="26"/>
  <text class="field" x="48" y="322">success</text>
  <text class="type" x="180" y="322">BOOLEAN</text>
  <text class="cell" x="300" y="322">The server's own control flow, one call site per value.</text>
  <rect class="tsrv" x="800" y="309" width="112" height="17" rx="8"/>
  <text class="tag" x="856" y="321.5" text-anchor="middle">server</text>

  <!-- row 8 -->
  <text class="field" x="48" y="350">error_message</text>
  <text class="type" x="180" y="350">TEXT</text>
  <text class="cell" x="300" y="350">PostgreSQL's own message. Failure path only.</text>
  <rect class="tdb" x="800" y="337" width="112" height="17" rx="8"/>
  <text class="tagon" x="856" y="349.5" text-anchor="middle">database</text>

  <!-- row 9 -->
  <rect class="zebra" x="34" y="360" width="892" height="26"/>
  <text class="field" x="48" y="378">note</text>
  <text class="type" x="180" y="378">TEXT</text>
  <text class="cell" x="300" y="378">Typed by the person who approved the write, in the confirmation form.</text>
  <rect class="thuman" x="800" y="365" width="112" height="17" rx="8"/>
  <text class="tagon" x="856" y="377.5" text-anchor="middle">the human</text>

  <!-- row 10 -->
  <text class="field" x="48" y="406">session_id</text>
  <text class="type" x="180" y="406">TEXT</text>
  <text class="cell" x="300" y="406">AUDIT_SESSION_ID. Deliberately not an MCP_ prefixed name.</text>
  <rect class="tenv" x="800" y="393" width="112" height="17" rx="8"/>
  <text class="tag" x="856" y="405.5" text-anchor="middle">environment</text>

  <!-- row 11 -->
  <rect class="zebra" x="34" y="416" width="892" height="26"/>
  <text class="field" x="48" y="434">actor</text>
  <text class="type" x="180" y="434">TEXT</text>
  <text class="cell" x="300" y="434">AUDIT_ACTOR. Under stdio there is nobody to authenticate.</text>
  <rect class="tenv" x="800" y="421" width="112" height="17" rx="8"/>
  <text class="tag" x="856" y="433.5" text-anchor="middle">environment</text>

  <line class="rule" x1="34" y1="452" x2="926" y2="452"/>

  <rect class="callout" x="34" y="464" width="892" height="52" rx="4"/>
  <rect class="barhuman" x="34" y="464" width="5" height="52"/>
  <text class="cell" x="54" y="486">The model authored the semantics of exactly one field, sql_text, and a person read that exact string before it ran. Every other</text>
  <text class="cell" x="54" y="504">column comes from the parse tree, the database, the approving human, or the operator's environment. Nothing it emits reaches them.</text>
</svg>
