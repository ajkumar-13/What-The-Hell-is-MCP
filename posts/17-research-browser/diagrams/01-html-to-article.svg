<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d">
  <title id="t">Two pages before and after extraction, drawn to one byte scale</title>
  <desc id="d">Two pages drawn as nested squares whose areas are proportional to measured byte counts, on a single scale shared by all four squares so they can be compared directly. Both pages stand on one dashed baseline. On the left, a plain article template: a large outlined square of 76,201 bytes fetched as HTML, annotated inside as 49.2 percent inline style sheets and 32.1 percent scripts, with a small solid square of 4,126 bytes kept as article text tucked into its bottom-left corner. Below it, 94.6 percent discarded, eighteen times smaller, and 707 words reaching the model. On the right, a portal page carrying a mega menu, advertising slots and a serialized store: a much larger outlined square of 243,128 bytes, annotated as 74.7 percent scripts, with a far smaller solid square of 860 bytes inside it. Below it, 99.6 percent discarded, two hundred and eighty-three times smaller, and 134 words reaching the model. Between the two pages the figure states its argument: the worse the page, the more the extractor is worth, because the right-hand page is three times the weight of the left-hand one and yields one fifth of the text.</desc>

