<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d">
  <title id="t">Two servers merged into one catalog, with the colliding name qualified on both sides</title>
  <desc id="d">Two terracotta server boxes on the right publish their tools. The first publishes four tools and the second publishes two, and one name, find_process, appears on both, which is marked as a collision on each side. In the middle a catalog counts every name across every server before naming anything, then qualifies only the contested name, and qualifies it on both sides so that neither server silently wins. On the left is the single flat list the model is shown, which is the only shape a provider tool API accepts. Below, two callouts carry the rules. The first is about the separator: a dot is inside the character set a tool name may use, a slash is not and is rejected at the catalog boundary rather than at a provider's API, and an underscore is available for providers whose own naming rules are narrower. The second is about dispatch: the qualified name is what the model sees, but what travels in the request is always the server's own bare name, because the server has never heard of the qualified form.</desc>

  <style><![CDATA[
    :root{--mcp-bg:#FAFAF7;--mcp-surface:#FFFDF9;--mcp-ink:#1A1A1A;--mcp-ink-muted:#5C5C5C;--mcp-ink-subtle:#9A9A9A;--mcp-border:#D9D9D4;--mcp-primary:#5B7FBF;--mcp-accent:#D98E5F;--mcp-success:#5C9E78;--mcp-warn:#B8895A;--mcp-alert:#C66B5E;--mcp-neutral-1:#EAEAE4;--mcp-neutral-2:#CFCFC8;--mcp-on-fill:#FFFDF9;}
    @media (prefers-color-scheme:dark){:root{--mcp-bg:#0E0F12;--mcp-surface:#16181C;--mcp-ink:#F2F2EE;--mcp-ink-muted:#B4B4AE;--mcp-ink-subtle:#6E6E68;--mcp-border:#2A2D33;--mcp-primary:#8BA8E0;--mcp-accent:#E8B088;--mcp-success:#7FBF9B;--mcp-warn:#D4B58A;--mcp-alert:#D88880;--mcp-neutral-1:#1F2229;--mcp-neutral-2:#2C3038;--mcp-on-fill:#14161A;}}
    .bg{fill:var(--mcp-bg);}
    .title{font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:20px;fill:var(--mcp-ink);}
    .head{font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:14px;fill:var(--mcp-ink);}
    .label{font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:13px;fill:var(--mcp-ink);}
    .small{font-family:Inter,system-ui,sans-serif;font-weight:400;font-size:12px;fill:var(--mcp-ink-muted);}
    .tiny{font-family:Inter,system-ui,sans-serif;font-weight:400;font-size:11px;fill:var(--mcp-ink-subtle);}
    .mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-weight:400;font-size:11px;fill:var(--mcp-ink);}
    .monom{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-weight:400;font-size:11px;fill:var(--mcp-ink-muted);}
    .monob{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-weight:600;font-size:11px;fill:var(--mcp-ink);}
    .zone{fill:var(--mcp-surface);stroke:var(--mcp-ink);stroke-width:1.5;}
    .chip{fill:var(--mcp-neutral-1);stroke:var(--mcp-border);stroke-width:1;}
    .client{fill:var(--mcp-primary);stroke:var(--mcp-ink);stroke-width:1.5;}
    .server{fill:var(--mcp-accent);stroke:var(--mcp-ink);stroke-width:1.5;}
    .bad{fill:var(--mcp-alert);stroke:var(--mcp-ink);stroke-width:1;}
    .onfill{font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:13px;fill:var(--mcp-on-fill);}
    .onfills{font-family:Inter,system-ui,sans-serif;font-weight:400;font-size:11px;fill:var(--mcp-on-fill);}
    .glyphi{stroke:var(--mcp-ink);stroke-width:1;fill:none;stroke-linecap:round;}
    .flow{stroke:var(--mcp-ink);stroke-width:1.5;fill:none;}
    .rule{stroke:var(--mcp-border);stroke-width:0.75;fill:none;}
  ]]></style>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--mcp-ink)"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="600"/>
  <text class="title" x="40" y="30">Many servers, one catalog</text>
  <text class="small" x="40" y="52">Qualify only what collides, qualify both sides, and use a dot because a slash is not a legal character in a tool name.</text>

  <!-- ================= servers ================= -->
  <rect class="server" x="680" y="76" width="240" height="24" rx="6"/>
  <text class="onfills" x="694" y="93">server: system-info</text>
  <rect class="zone" x="680" y="100" width="240" height="94" rx="0"/>
  <text class="mono" x="694" y="120">get_system_info</text>
  <text class="mono" x="694" y="138">find_process</text>
  <rect class="bad" x="828" y="128" width="80" height="14" rx="3"/>
  <text class="onfills" x="836" y="139">collides</text>
  <text class="mono" x="694" y="156">terminate_process</text>
  <text class="mono" x="694" y="174">watch_cpu</text>

  <rect class="server" x="680" y="226" width="240" height="24" rx="6"/>
  <text class="onfills" x="694" y="243">server: mini</text>
  <rect class="zone" x="680" y="250" width="240" height="58" rx="0"/>
  <text class="mono" x="694" y="270">find_process</text>
  <rect class="bad" x="828" y="260" width="80" height="14" rx="3"/>
  <text class="onfills" x="836" y="271">collides</text>
  <text class="mono" x="694" y="290">ping</text>

  <text class="tiny" x="680" y="330">Names are unique inside one server</text>
  <text class="tiny" x="680" y="345">and nowhere else. The name a server</text>
  <text class="tiny" x="680" y="360">reports for itself is not unique either.</text>

  <!-- ================= catalog ================= -->
  <rect class="zone" x="318" y="76" width="332" height="288" rx="10"/>
  <text class="head" x="334" y="98">ToolCatalog.build(...)</text>
  <text class="small" x="334" y="116">Counts every name across every server first,</text>
  <text class="small" x="334" y="131">then names anything.</text>
  <line class="rule" x1="334" y1="142" x2="634" y2="142"/>

  <text class="monob" x="334" y="162">find_process</text>
  <text class="monom" x="440" y="162">seen twice</text>
  <text class="small" x="334" y="179">qualify on BOTH sides, never one. The server</text>
  <text class="small" x="334" y="194">listed first must not silently win.</text>

  <text class="monob" x="334" y="220">everything else</text>
  <text class="monom" x="452" y="220">seen once</text>
  <text class="small" x="334" y="237">keep the bare name: it is what the server's own</text>
  <text class="small" x="334" y="252">documentation calls it.</text>

  <line class="rule" x1="334" y1="266" x2="634" y2="266"/>
  <text class="small" x="334" y="286">Every tool is also registered under its qualified</text>
  <text class="small" x="334" y="301">form, so a name the model saw in an earlier turn</text>
  <text class="small" x="334" y="316">still resolves after the collision goes away.</text>
  <text class="monom" x="334" y="338">entry.name       shown to the model</text>
  <text class="monom" x="334" y="354">entry.tool_name  sent on the wire</text>

  <path class="flow" d="M676,140 L656,140" marker-end="url(#ar)"/>
  <path class="flow" d="M676,272 L656,272" marker-end="url(#ar)"/>

  <!-- ================= what the model sees ================= -->
  <rect class="client" x="40" y="76" width="248" height="24" rx="6"/>
  <text class="onfills" x="54" y="93">what the model is shown</text>
  <rect class="zone" x="40" y="100" width="248" height="176" rx="0"/>
  <text class="tiny" x="54" y="120">one flat list; the only shape a</text>
  <text class="tiny" x="54" y="135">provider tool API accepts</text>
  <text class="mono" x="54" y="159">get_system_info</text>
  <text class="mono" x="54" y="177">system-info.find_process</text>
  <text class="mono" x="54" y="195">terminate_process</text>
  <text class="mono" x="54" y="213">watch_cpu</text>
  <text class="mono" x="54" y="231">mini.find_process</text>
  <text class="mono" x="54" y="249">ping</text>
  <text class="tiny" x="54" y="268">two qualified, four left alone</text>

  <path class="flow" d="M314,188 L292,188" marker-end="url(#ar)"/>

  <!-- ================= callout 1: the separator ================= -->
  <rect class="zone" x="40" y="396" width="430" height="118" rx="10"/>
  <text class="head" x="56" y="418">The separator is a dot, and it has to be</text>
  <line class="rule" x1="56" y1="428" x2="454" y2="428"/>
  <path class="glyphi" d="M60,443 l4,4.5 l8,-9.5"/>
  <text class="mono" x="80" y="447">system-info.find_process</text>
  <text class="tiny" x="256" y="447">legal: letters, digits, _ . -</text>
  <path class="glyphi" d="M60,464 l8,8 M68,464 l-8,8"/>
  <text class="mono" x="80" y="472">system-info/find_process</text>
  <text class="tiny" x="256" y="472">a slash is outside the set</text>
  <text class="small" x="56" y="494">Rejected at the catalog, naming the server, rather than at a provider's</text>
  <text class="small" x="56" y="508">API. Pass separator="_" for providers whose own rules are narrower.</text>

  <!-- ================= callout 2: the wire name ================= -->
  <rect class="zone" x="490" y="396" width="430" height="118" rx="10"/>
  <text class="head" x="506" y="418">The wire name is the server's own</text>
  <line class="rule" x1="506" y1="428" x2="904" y2="428"/>
  <text class="small" x="506" y="447">the model asks for</text>
  <text class="mono" x="626" y="447">mini.find_process</text>
  <text class="small" x="506" y="466">the catalog resolves</text>
  <text class="mono" x="626" y="466">server="mini", tool_name="find_process"</text>
  <text class="small" x="506" y="485">the host sends</text>
  <text class="mono" x="626" y="485">{"name": "find_process"}</text>
  <text class="tiny" x="506" y="505">The server has never heard of the qualified form, and must not be sent it.</text>

  <text class="small" x="40" y="552">Prefix with the key you gave the connection in your own configuration file. It is unique on your machine, which is more than the server's</text>
  <text class="small" x="40" y="570">self-reported name can promise. Shadowing, where one tool silently vanishes, is the strategy to recognize in other hosts and not to copy.</text>
</svg>
