<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 450">
  <defs>
    <linearGradient id="inputGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BBDEFB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="parseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EDE7F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D1C4E9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF3E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE0B2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E0F7FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B2EBF2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFEBEE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFCDD2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="passGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8E6C9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5C6BC0"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#43A047"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E53935"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="750" height="450" fill="#F5F7FA"/>
  
  <!-- Title -->
  <text x="375" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#37474F" text-anchor="middle">
    SQL Security Validation Flow
  </text>
  
  <!-- Step 1: Input Query -->
  <g transform="translate(50, 60)">
    <rect width="180" height="70" rx="10" fill="url(#inputGrad)" stroke="#42A5F5" stroke-width="2" filter="url(#shadow)"/>
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1565C0" text-anchor="middle">
      1. INCOMING QUERY
    </text>
    <rect x="15" y="35" width="150" height="28" rx="4" fill="white" opacity="0.7"/>
    <text x="90" y="50" font-family="Consolas, monospace" font-size="10" fill="#37474F" text-anchor="middle">
      "DELETE FROM users"
    </text>
    <text x="90" y="62" font-family="Arial, sans-serif" font-size="9" fill="#78909C" text-anchor="middle">
      or any SQL
    </text>
  </g>
  
  <!-- Arrow to Parse -->
  <line x1="230" y1="95" x2="280" y2="95" stroke="#5C6BC0" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Step 2: Parse -->
  <g transform="translate(290, 60)">
    <rect width="180" height="70" rx="10" fill="url(#parseGrad)" stroke="#7E57C2" stroke-width="2" filter="url(#shadow)"/>
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#512DA8" text-anchor="middle">
      2. TOKENIZE (sqlparse)
    </text>
    <rect x="15" y="35" width="150" height="28" rx="4" fill="white" opacity="0.7"/>
    <text x="90" y="50" font-family="Arial, sans-serif" font-size="10" fill="#546E7A" text-anchor="middle">
      Split into statements
    </text>
    <text x="90" y="62" font-family="Arial, sans-serif" font-size="10" fill="#546E7A" text-anchor="middle">
      Build token tree
    </text>
  </g>
  
  <!-- Arrow to Check Type -->
  <line x1="470" y1="95" x2="520" y2="95" stroke="#5C6BC0" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Step 3: Check Type -->
  <g transform="translate(530, 60)">
    <rect width="180" height="70" rx="10" fill="url(#checkGrad)" stroke="#FFA726" stroke-width="2" filter="url(#shadow)"/>
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#E65100" text-anchor="middle">
      3. CHECK TYPE
    </text>
    <rect x="15" y="35" width="150" height="28" rx="4" fill="white" opacity="0.7"/>
    <text x="90" y="50" font-family="Consolas, monospace" font-size="10" fill="#37474F" text-anchor="middle">
      stmt.get_type()
    </text>
    <text x="90" y="62" font-family="Arial, sans-serif" font-size="10" fill="#78909C" text-anchor="middle">
      → "DELETE"
    </text>
  </g>
  
  <!-- Decision Diamond -->
  <polygon points="375,170 440,210 375,250 310,210" fill="white" stroke="#FFA726" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="375" y="205" font-family="Arial, sans-serif" font-size="11" fill="#37474F" text-anchor="middle">SELECT?</text>
  <text x="375" y="220" font-family="Arial, sans-serif" font-size="10" fill="#E65100" text-anchor="middle">type check</text>
  
  <!-- Arrow from Check Type to Diamond -->
  <path d="M 620 130 L 620 160 Q 620 180 600 180 L 440 210" fill="none" stroke="#5C6BC0" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- NO Path - Block -->
  <line x1="310" y1="210" x2="180" y2="210" stroke="#E53935" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="245" y="200" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#E53935">NO</text>
  
  <!-- Blocked Box 1 -->
  <g transform="translate(50, 175)">
    <rect width="130" height="70" rx="10" fill="url(#blockGrad)" stroke="#E53935" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="65" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#C62828" text-anchor="middle">
      🛑 BLOCKED
    </text>
    <text x="65" y="45" font-family="Arial, sans-serif" font-size="10" fill="#C62828" text-anchor="middle">SecurityError</text>
    <text x="65" y="58" font-family="Arial, sans-serif" font-size="9" fill="#78909C" text-anchor="middle">"DELETE forbidden"</text>
  </g>
  
  <!-- YES Path - Deep Scan -->
  <line x1="440" y1="210" x2="520" y2="210" stroke="#43A047" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="480" y="200" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#43A047">YES</text>
  
  <!-- Step 4: Deep Token Scan -->
  <g transform="translate(530, 175)">
    <rect width="180" height="70" rx="10" fill="url(#scanGrad)" stroke="#00ACC1" stroke-width="2" filter="url(#shadow)"/>
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#00838F" text-anchor="middle">
      4. DEEP TOKEN SCAN
    </text>
    <rect x="15" y="35" width="150" height="28" rx="4" fill="white" opacity="0.7"/>
    <text x="90" y="50" font-family="Arial, sans-serif" font-size="10" fill="#546E7A" text-anchor="middle">
      Check every token
    </text>
    <text x="90" y="62" font-family="Arial, sans-serif" font-size="10" fill="#546E7A" text-anchor="middle">
      Find hidden keywords
    </text>
  </g>
  
  <!-- Second Decision Diamond -->
  <polygon points="620,290 685,330 620,370 555,330" fill="white" stroke="#00ACC1" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="620" y="325" font-family="Arial, sans-serif" font-size="10" fill="#37474F" text-anchor="middle">Forbidden</text>
  <text x="620" y="340" font-family="Arial, sans-serif" font-size="10" fill="#37474F" text-anchor="middle">Keywords?</text>
  
  <!-- Arrow to second diamond -->
  <line x1="620" y1="245" x2="620" y2="288" stroke="#5C6BC0" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- YES (dangerous) - Block -->
  <line x1="555" y1="330" x2="400" y2="330" stroke="#E53935" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="480" y="320" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#E53935">YES</text>
  
  <!-- Second Blocked Box -->
  <g transform="translate(250, 295)">
    <rect width="150" height="70" rx="10" fill="url(#blockGrad)" stroke="#E53935" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="75" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#C62828" text-anchor="middle">
      🛑 BLOCKED
    </text>
    <text x="75" y="45" font-family="Arial, sans-serif" font-size="10" fill="#C62828" text-anchor="middle">"Dangerous keyword"</text>
    <text x="75" y="58" font-family="Arial, sans-serif" font-size="9" fill="#78909C" text-anchor="middle">e.g., DROP in subquery</text>
  </g>
  
  <!-- NO (safe) - Execute -->
  <line x1="685" y1="330" x2="720" y2="330" stroke="#43A047" stroke-width="2"/>
  <path d="M 720 330 L 720 400 L 620 400" fill="none" stroke="#43A047" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="705" y="320" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#43A047">NO</text>
  
  <!-- Execute Box -->
  <g transform="translate(530, 375)">
    <rect width="180" height="50" rx="10" fill="url(#passGrad)" stroke="#43A047" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2E7D32" text-anchor="middle">
      ✅ EXECUTE
    </text>
    <text x="90" y="42" font-family="Arial, sans-serif" font-size="10" fill="#558B2F" text-anchor="middle">Send to PostgreSQL</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(50, 385)">
    <rect width="170" height="55" rx="8" fill="white" stroke="#90CAF9" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="15" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#37474F">Legend:</text>
    <circle cx="25" cy="35" r="6" fill="#E53935"/>
    <text x="40" y="39" font-family="Arial, sans-serif" font-size="10" fill="#546E7A">Block path</text>
    <circle cx="100" cy="35" r="6" fill="#43A047"/>
    <text x="115" y="39" font-family="Arial, sans-serif" font-size="10" fill="#546E7A">Safe path</text>
  </g>
</svg>