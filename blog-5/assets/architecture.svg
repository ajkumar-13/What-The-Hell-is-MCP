<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="claudeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BBDEFB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8E6C9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF3E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE0B2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="securityGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFEBEE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFCDD2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5C6BC0"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#F5F7FA"/>
  
  <!-- Title -->
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#37474F" text-anchor="middle">
    Secure Database Analyst Architecture
  </text>
  
  <!-- User + Claude Box -->
  <g transform="translate(30, 70)">
    <rect width="160" height="110" rx="12" fill="url(#claudeGrad)" stroke="#42A5F5" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="80" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1565C0" text-anchor="middle">
      👤 User + Claude
    </text>
    <text x="80" y="52" font-family="Arial, sans-serif" font-size="11" fill="#546E7A" text-anchor="middle">
      (MCP Host)
    </text>
    <rect x="15" y="65" width="130" height="35" rx="6" fill="white" opacity="0.7"/>
    <text x="80" y="82" font-family="Arial, sans-serif" font-size="10" fill="#455A64" text-anchor="middle">
      "Show me all users"
    </text>
    <text x="80" y="94" font-family="Arial, sans-serif" font-size="10" fill="#455A64" text-anchor="middle">
      "What's our revenue?"
    </text>
  </g>
  
  <!-- Arrow to MCP Server -->
  <line x1="190" y1="125" x2="235" y2="125" stroke="#5C6BC0" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="213" y="115" font-family="Arial, sans-serif" font-size="10" fill="#5C6BC0" text-anchor="middle">MCP</text>
  
  <!-- MCP Server Container -->
  <rect x="245" y="55" width="320" height="390" rx="15" fill="white" stroke="#5C6BC0" stroke-width="2.5" stroke-dasharray="8,4" filter="url(#shadow)"/>
  <text x="405" y="82" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#37474F" text-anchor="middle">
    MCP Server
  </text>
  <text x="405" y="100" font-family="Arial, sans-serif" font-size="11" fill="#78909C" text-anchor="middle">
    mcp-db-analyst/src/
  </text>
  
  <!-- server.py -->
  <g transform="translate(265, 115)">
    <rect width="280" height="55" rx="8" fill="url(#serverGrad)" stroke="#66BB6A" stroke-width="2" filter="url(#shadow)"/>
    <text x="20" y="25" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#2E7D32">
      server.py
    </text>
    <text x="20" y="42" font-family="Arial, sans-serif" font-size="10" fill="#546E7A">
      • FastMCP entry point
    </text>
    <text x="150" y="42" font-family="Arial, sans-serif" font-size="10" fill="#546E7A">
      • Resources &amp; Tools
    </text>
  </g>
  
  <!-- security.py (Highlighted) -->
  <g transform="translate(265, 180)">
    <rect width="280" height="70" rx="8" fill="url(#securityGrad)" stroke="#E53935" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="20" y="25" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#C62828">
      security.py 🛡️
    </text>
    <text x="20" y="42" font-family="Arial, sans-serif" font-size="10" fill="#546E7A">
      • SQL Tokenizer (sqlparse)
    </text>
    <text x="20" y="57" font-family="Arial, sans-serif" font-size="10" fill="#546E7A">
      • Block DROP, DELETE, UPDATE...
    </text>
    <text x="200" y="42" font-family="Arial, sans-serif" font-size="10" fill="#2E7D32" font-weight="600">
      ✓ SELECT only
    </text>
  </g>
  
  <!-- database.py -->
  <g transform="translate(265, 260)">
    <rect width="280" height="55" rx="8" fill="url(#dbGrad)" stroke="#FFA726" stroke-width="2" filter="url(#shadow)"/>
    <text x="20" y="25" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#E65100">
      database.py
    </text>
    <text x="20" y="42" font-family="Arial, sans-serif" font-size="10" fill="#546E7A">
      • Connection Pool (asyncpg)
    </text>
    <text x="165" y="42" font-family="Arial, sans-serif" font-size="10" fill="#546E7A">
      • Pool: 2-10 conns
    </text>
  </g>
  
  <!-- schema.py -->
  <g transform="translate(265, 325)">
    <rect width="280" height="55" rx="8" fill="url(#claudeGrad)" stroke="#29B6F6" stroke-width="2" filter="url(#shadow)"/>
    <text x="20" y="25" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#0277BD">
      schema.py
    </text>
    <text x="20" y="42" font-family="Arial, sans-serif" font-size="10" fill="#546E7A">
      • Introspect tables, columns
    </text>
    <text x="165" y="42" font-family="Arial, sans-serif" font-size="10" fill="#546E7A">
      • Foreign keys
    </text>
  </g>
  
  <!-- Primitives Labels -->
  <g transform="translate(265, 395)">
    <rect width="130" height="30" rx="6" fill="#E8F5E9" stroke="#66BB6A" stroke-width="1.5"/>
    <text x="65" y="20" font-family="Arial, sans-serif" font-size="11" fill="#2E7D32" text-anchor="middle">
      📂 Resource: Schema
    </text>
  </g>
  <g transform="translate(415, 395)">
    <rect width="130" height="30" rx="6" fill="#FFF3E0" stroke="#FFA726" stroke-width="1.5"/>
    <text x="65" y="20" font-family="Arial, sans-serif" font-size="11" fill="#E65100" text-anchor="middle">
      🔧 Tool: query_db
    </text>
  </g>
  
  <!-- Arrow to Database -->
  <line x1="565" y1="285" x2="610" y2="285" stroke="#5C6BC0" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="588" y="275" font-family="Arial, sans-serif" font-size="9" fill="#78909C" text-anchor="middle">Safe SQL</text>
  
  <!-- PostgreSQL Box -->
  <g transform="translate(620, 220)">
    <rect width="150" height="130" rx="12" fill="url(#dbGrad)" stroke="#336791" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="75" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#336791" text-anchor="middle">
      🐘 PostgreSQL
    </text>
    <rect x="20" y="45" width="110" height="70" rx="6" fill="white" opacity="0.7"/>
    <text x="75" y="65" font-family="Arial, sans-serif" font-size="11" fill="#546E7A" text-anchor="middle">users</text>
    <text x="75" y="82" font-family="Arial, sans-serif" font-size="11" fill="#546E7A" text-anchor="middle">orders</text>
    <text x="75" y="99" font-family="Arial, sans-serif" font-size="11" fill="#546E7A" text-anchor="middle">products</text>
    <text x="75" y="113" font-family="Arial, sans-serif" font-size="10" fill="#90A4AE" text-anchor="middle">...</text>
  </g>
  
  <!-- Security Badge -->
  <g transform="translate(620, 70)">
    <rect width="150" height="90" rx="12" fill="url(#securityGrad)" stroke="#E53935" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="75" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#C62828" text-anchor="middle">
      🛡️ Security Layer
    </text>
    <rect x="15" y="40" width="120" height="40" rx="6" fill="white" opacity="0.7"/>
    <text x="75" y="58" font-family="Arial, sans-serif" font-size="10" fill="#2E7D32" text-anchor="middle">✓ SELECT → Execute</text>
    <text x="75" y="73" font-family="Arial, sans-serif" font-size="10" fill="#C62828" text-anchor="middle">✗ DELETE → Block</text>
  </g>
  
  <!-- Flow Legend -->
  <g transform="translate(30, 420)">
    <rect width="180" height="60" rx="8" fill="white" stroke="#90CAF9" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="15" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#37474F">Data Flow:</text>
    <text x="15" y="40" font-family="Arial, sans-serif" font-size="10" fill="#2E7D32">1. Query → Security Check</text>
    <text x="15" y="54" font-family="Arial, sans-serif" font-size="10" fill="#E65100">2. If safe → Pool → Execute</text>
  </g>
</svg>