<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="700" height="480" fill="url(#bgGrad)" rx="12"/>
  
  <!-- Terminal window -->
  <rect x="20" y="20" width="660" height="440" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="20" y="20" width="660" height="35" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="20" y="45" width="660" height="10" fill="#f1f5f9"/>
  
  <!-- Window controls -->
  <circle cx="45" cy="37" r="6" fill="#fca5a5"/>
  <circle cx="65" cy="37" r="6" fill="#fcd34d"/>
  <circle cx="85" cy="37" r="6" fill="#86efac"/>
  
  <!-- Terminal title -->
  <text x="350" y="42" text-anchor="middle" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="12">MCP Client — Terminal</text>
  
  <!-- Terminal content -->
  <rect x="30" y="60" width="640" height="390" fill="#fafbfc" rx="0"/>
  
  <!-- Connection status -->
  <text x="40" y="85" fill="#16a34a" font-family="Consolas, monospace" font-size="13" font-weight="bold">✓ Connected to server!</text>
  <text x="40" y="105" fill="#0369a1" font-family="Consolas, monospace" font-size="13">  Found 2 tools:</text>
  <text x="40" y="125" fill="#64748b" font-family="Consolas, monospace" font-size="13">    • get_system_info: Get current CPU, memory, and disk usage</text>
  <text x="40" y="145" fill="#64748b" font-family="Consolas, monospace" font-size="13">    • find_process: Find processes by name</text>
  
  <!-- Separator -->
  <line x1="40" y1="162" x2="650" y2="162" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="40" y="182" fill="#475569" font-family="Consolas, monospace" font-size="13">Chat started! Type 'quit' to exit.</text>
  <line x1="40" y1="192" x2="650" y2="192" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <!-- First interaction -->
  <text x="40" y="220" fill="#2563eb" font-family="Consolas, monospace" font-size="13" font-weight="bold">You:</text>
  <text x="85" y="220" fill="#334155" font-family="Consolas, monospace" font-size="13">What is my current system status?</text>
  
  <rect x="40" y="232" width="260" height="20" rx="4" fill="#fef3c7"/>
  <text x="50" y="247" fill="#b45309" font-family="Consolas, monospace" font-size="12">  → Using tool: get_system_info</text>
  
  <text x="40" y="280" fill="#059669" font-family="Consolas, monospace" font-size="13" font-weight="bold">Assistant:</text>
  <text x="40" y="300" fill="#475569" font-family="Consolas, monospace" font-size="13">Your system is doing great! Here's the breakdown:</text>
  <text x="40" y="320" fill="#475569" font-family="Consolas, monospace" font-size="13">• CPU: 12% usage</text>
  <text x="40" y="340" fill="#475569" font-family="Consolas, monospace" font-size="13">• Memory: 8.2 GB used of 16 GB (51%)</text>
  <text x="40" y="360" fill="#475569" font-family="Consolas, monospace" font-size="13">• Disk: 234 GB free of 500 GB</text>
  <text x="40" y="380" fill="#16a34a" font-family="Consolas, monospace" font-size="13" font-weight="600">Everything looks healthy!</text>
  
  <!-- Second interaction (partial) -->
  <text x="40" y="415" fill="#2563eb" font-family="Consolas, monospace" font-size="13" font-weight="bold">You:</text>
  <text x="85" y="415" fill="#334155" font-family="Consolas, monospace" font-size="13">Find any processes with "chrome"</text>
  
  <!-- Cursor blink -->
  <rect x="355" y="403" width="8" height="16" fill="#2563eb" rx="1">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
