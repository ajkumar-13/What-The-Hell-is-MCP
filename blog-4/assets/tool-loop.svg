<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrowhead-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/>
    </marker>
    <marker id="arrowhead-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" rx="12"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#1e293b" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">The Tool Execution Loop</text>
  
  <!-- Step 1: User -->
  <rect x="50" y="80" width="140" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="105" text-anchor="middle" fill="#16a34a" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">STEP 1</text>
  <text x="120" y="125" text-anchor="middle" fill="#1e293b" font-family="system-ui, sans-serif" font-size="14">👤 User</text>
  
  <!-- Step 1 description -->
  <text x="120" y="160" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">"Check my CPU"</text>
  
  <!-- Arrow 1 to Client -->
  <line x1="190" y1="110" x2="260" y2="110" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2: Client -->
  <rect x="270" y="80" width="140" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="105" text-anchor="middle" fill="#6366f1" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">STEP 2</text>
  <text x="340" y="125" text-anchor="middle" fill="#1e293b" font-family="system-ui, sans-serif" font-size="14">🖥️ MCP Client</text>
  
  <!-- Arrow 2 to LLM -->
  <line x1="410" y1="110" x2="480" y2="110" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3: LLM -->
  <rect x="490" y="80" width="140" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="560" y="105" text-anchor="middle" fill="#d97706" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">STEP 3</text>
  <text x="560" y="125" text-anchor="middle" fill="#1e293b" font-family="system-ui, sans-serif" font-size="14">🧠 Claude API</text>
  
  <!-- LLM Decision -->
  <text x="560" y="160" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Decides: "I need a tool!"</text>
  
  <!-- Arrow 3 to decision diamond -->
  <line x1="560" y1="172" x2="560" y2="210" stroke="#d97706" stroke-width="2" marker-end="url(#arrowhead-amber)"/>
  
  <!-- Decision Diamond -->
  <polygon points="560,220 620,260 560,300 500,260" fill="white" stroke="#d97706" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="560" y="255" text-anchor="middle" fill="#1e293b" font-family="system-ui, sans-serif" font-size="11">tool_use?</text>
  <text x="560" y="270" text-anchor="middle" fill="#d97706" font-family="system-ui, sans-serif" font-size="10">stop_reason</text>
  
  <!-- Yes path - down to tool execution -->
  <line x1="560" y1="300" x2="560" y2="330" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="580" y="320" fill="#16a34a" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Yes</text>
  
  <!-- Step 4: Execute Tool -->
  <rect x="490" y="340" width="140" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="560" y="365" text-anchor="middle" fill="#16a34a" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">STEP 4</text>
  <text x="560" y="385" text-anchor="middle" fill="#1e293b" font-family="system-ui, sans-serif" font-size="14">⚡ Execute Tool</text>
  
  <!-- Arrow to MCP Server -->
  <line x1="630" y1="370" x2="700" y2="370" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  
  <!-- MCP Server box -->
  <rect x="710" y="340" width="70" height="60" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="745" y="373" text-anchor="middle" fill="#1e293b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">MCP</text>
  <text x="745" y="388" text-anchor="middle" fill="#1e293b" font-family="system-ui, sans-serif" font-size="10">Server</text>
  
  <!-- Result back arrow -->
  <path d="M 710 400 Q 660 430 560 430 Q 460 430 400 370" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="560" y="450" text-anchor="middle" fill="#7c3aed" font-family="system-ui, sans-serif" font-size="11">Result back to client</text>
  
  <!-- Step 5: Back to LLM (loop) -->
  <path d="M 340 140 Q 340 200 400 260 Q 460 260 500 260" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="365" y="215" fill="#6366f1" font-family="system-ui, sans-serif" font-size="10">+ tool result</text>
  
  <!-- No path - final answer -->
  <line x1="620" y1="260" x2="660" y2="260" stroke="#dc2626" stroke-width="2"/>
  <text x="630" y="250" fill="#dc2626" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">No</text>
  
  <!-- Step 6: Final Answer -->
  <rect x="660" y="230" width="120" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="720" y="255" text-anchor="middle" fill="#dc2626" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">STEP 6</text>
  <text x="720" y="275" text-anchor="middle" fill="#1e293b" font-family="system-ui, sans-serif" font-size="14">✅ Final Answer</text>
  
  <!-- Key insight box -->
  <rect x="50" y="200" width="200" height="90" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="225" fill="#92400e" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">💡 Key Insight:</text>
  <text x="60" y="245" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">When stop_reason == "tool_use"</text>
  <text x="60" y="260" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Claude is NOT done!</text>
  <text x="60" y="280" fill="#16a34a" font-family="system-ui, sans-serif" font-size="11">Execute tool → send result back</text>
  
  <!-- Loop indicator -->
  <path d="M 490 370 Q 380 370 340 350 Q 300 330 300 280 Q 300 180 300 140" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="280" y="250" fill="#6366f1" font-family="system-ui, sans-serif" font-size="10" transform="rotate(-90 280 250)">LOOP</text>
</svg>
