<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600">
  <defs>
    <style>
      .box { fill: #3498db; stroke: #2c3e50; stroke-width: 2; }
      .text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; fill: #ffffff; font-weight: bold; }
      .text-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #2c3e50; }
      .text-small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #7f8c8d; font-style: italic; }
      .line-vertical { stroke: #95a5a6; stroke-width: 2; stroke-dasharray: 5,5; }
      .arrow { stroke: #3498db; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead-blue); }
      .arrow-back { stroke: #e74c3c; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead-red); }
      .ready-box { fill: #2ecc71; stroke: #27ae60; stroke-width: 2; }
      .ready-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; fill: #ffffff; font-weight: bold; }
    </style>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3498db" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e74c3c" />
    </marker>
  </defs>
  
  <!-- Client box -->
  <rect x="80" y="20" width="140" height="60" class="box" rx="5"/>
  <text x="150" y="55" class="text" text-anchor="middle">CLIENT</text>
  
  <!-- Server box -->
  <rect x="480" y="20" width="140" height="60" class="box" rx="5"/>
  <text x="550" y="55" class="text" text-anchor="middle">SERVER</text>
  
  <!-- Vertical lines -->
  <line x1="150" y1="80" x2="150" y2="550" class="line-vertical"/>
  <line x1="550" y1="80" x2="550" y2="550" class="line-vertical"/>
  
  <!-- Step 1: initialize -->
  <line x1="150" y1="120" x2="530" y2="120" class="arrow"/>
  <text x="340" y="110" class="text-label" text-anchor="middle">initialize</text>
  <text x="340" y="135" class="text-small" text-anchor="middle">(protocol version, caps)</text>
  
  <!-- Step 2: initialize result -->
  <line x1="530" y1="180" x2="170" y2="180" class="arrow-back"/>
  <text x="340" y="170" class="text-label" text-anchor="middle">initialize result</text>
  <text x="340" y="195" class="text-small" text-anchor="middle">(server info, caps)</text>
  
  <!-- Step 3: initialized -->
  <line x1="150" y1="240" x2="530" y2="240" class="arrow"/>
  <text x="340" y="230" class="text-label" text-anchor="middle">initialized</text>
  <text x="340" y="255" class="text-small" text-anchor="middle">(ready to work)</text>
  
  <!-- Step 4: tools/list -->
  <line x1="150" y1="300" x2="530" y2="300" class="arrow"/>
  <text x="340" y="290" class="text-label" text-anchor="middle">tools/list</text>
  
  <!-- Step 5: tools list response -->
  <line x1="530" y1="340" x2="170" y2="340" class="arrow-back"/>
  <text x="340" y="355" class="text-label" text-anchor="middle">tools list</text>
  
  <!-- Step 6: resources/list -->
  <line x1="150" y1="390" x2="530" y2="390" class="arrow"/>
  <text x="340" y="380" class="text-label" text-anchor="middle">resources/list</text>
  
  <!-- Step 7: resources list response -->
  <line x1="530" y1="430" x2="170" y2="430" class="arrow-back"/>
  <text x="340" y="445" class="text-label" text-anchor="middle">resources list</text>
  
  <!-- Ready to work banner -->
  <rect x="250" y="490" width="200" height="50" class="ready-box" rx="5"/>
  <text x="350" y="520" class="ready-text" text-anchor="middle">READY TO WORK</text>
</svg>
