<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250">
  <defs>
    <style>
      .client-box { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .server-box { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; fill: #2c3e50; font-weight: bold; }
      .text-small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #7f8c8d; font-style: italic; }
      .text-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #3498db; font-weight: 600; }
      .arrow { stroke: #3498db; stroke-width: 3; fill: none; }
      .cloud { fill: #dbeafe; stroke: #3b82f6; stroke-width: 2; }
      .cloud-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #3b82f6; font-weight: bold; }
    </style>
    <marker id="arrowhead-double" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3498db" />
    </marker>
  </defs>
  
  <!-- Client box -->
  <rect x="50" y="80" width="150" height="90" class="client-box" rx="5"/>
  <text x="125" y="115" class="text" text-anchor="middle">CLIENT</text>
  <text x="125" y="140" class="text-small" text-anchor="middle">(Laptop)</text>
  
  <!-- Server box -->
  <rect x="400" y="80" width="150" height="90" class="server-box" rx="5"/>
  <text x="475" y="115" class="text" text-anchor="middle">SERVER</text>
  <text x="475" y="140" class="text-small" text-anchor="middle">(Cloud)</text>
  
  <!-- Cloud/Internet in middle -->
  <ellipse cx="300" cy="125" rx="50" ry="30" class="cloud"/>
  <text x="300" y="120" class="cloud-text" text-anchor="middle">Internet</text>
  <text x="300" y="135" class="cloud-text" text-anchor="middle">HTTP/SSE</text>
  
  <!-- Bidirectional arrow -->
  <line x1="200" y1="125" x2="250" y2="125" class="arrow" marker-end="url(#arrowhead-double)"/>
  <line x1="350" y1="125" x2="400" y2="125" class="arrow" marker-end="url(#arrowhead-double)"/>
</svg>