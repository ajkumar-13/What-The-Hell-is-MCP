<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #3498db; stroke-width: 2; }
      .client-box { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .server-box { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; fill: #2c3e50; font-weight: bold; }
      .text-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #3498db; font-weight: 600; }
      .arrow { stroke: #3498db; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-back { stroke: #e74c3c; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead-red); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3498db" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e74c3c" />
    </marker>
  </defs>
  
  <!-- Client box -->
  <rect x="50" y="80" width="150" height="90" class="client-box" rx="5"/>
  <text x="125" y="130" class="text" text-anchor="middle">CLIENT</text>
  
  <!-- Server box -->
  <rect x="300" y="80" width="150" height="90" class="server-box" rx="5"/>
  <text x="375" y="130" class="text" text-anchor="middle">SERVER</text>
  
  <!-- stdin arrow -->
  <line x1="200" y1="105" x2="280" y2="105" class="arrow"/>
  <text x="240" y="95" class="text-label" text-anchor="middle">stdin</text>
  
  <!-- stdout arrow -->
  <line x1="280" y1="145" x2="200" y2="145" class="arrow-back"/>
  <text x="240" y="165" class="text-label" text-anchor="middle">stdout</text>
</svg>