[project]
name = "mcp-k8s-responder"
version = "0.1.0"
description = "The Kubernetes DevOps first-responder MCP server built across posts 15 and 16 of the series"
readme = "README.md"
requires-python = ">=3.10"

# Pinned exactly. This project was written and tested against the 2.0 beta that
# implements protocol revision 2026-07-28. Do not float this pin: the 1.x line
# uses a completely different module layout (mcp.server.fastmcp, mcp.types).
dependencies = [
    "mcp[cli]==2.0.0b2",
    "kubernetes>=31.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
mcp-k8s-responder = "k8s_responder.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/k8s_responder"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
