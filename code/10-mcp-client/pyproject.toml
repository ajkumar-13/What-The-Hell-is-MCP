[project]
name = "mcp-host"
version = "0.1.0"
description = "An MCP client and host, built across posts 10 and 11 of the series"
readme = "README.md"
requires-python = ">=3.10"

# Pinned exactly, for the same reason the server project is: this code was
# written against mcp 2.3.0, which implements protocol revision 2026-07-28.
# The 1.x line has a different module layout (mcp.types, streamablehttp_client)
# and none of the client code here would import.
dependencies = [
    "mcp[cli]==2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    # The suite opens the post 05 server in memory, so it needs that package and
    # its psutil dependency. Declaring it beats a PYTHONPATH the reader has to
    # remember: `uv run pytest` then works from a clean clone.
    "mcp-system-info",
]
# The reference provider needs no key and no network. A real provider adapter
# is optional on purpose: the host works without one.
anthropic = [
    "anthropic>=0.40.0",
]

[project.scripts]
mcp-host = "mcp_host.__main__:main"

[tool.uv.sources]
mcp-system-info = { path = "../05-first-server", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_host"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
