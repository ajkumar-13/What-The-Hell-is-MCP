[project]
name = "mcp-research-browser"
version = "0.2.0"
description = "The deep research browser MCP server built across posts 17 and 18 of the series"
readme = "README.md"
requires-python = ">=3.10"

# Pinned exactly. This project was written and tested against the 2.0 beta that
# implements protocol revision 2026-07-28. Do not float this pin: the 1.x line
# uses a completely different module layout (mcp.server.fastmcp, mcp.types).
#
# trafilatura and markdownify are pinned to a major line because post 17 quotes
# the size-reduction numbers the test suite measures against the committed
# fixtures. A different extractor version moves those numbers.
dependencies = [
    "mcp[cli]==2.0.0b2",
    "playwright>=1.49",
    "trafilatura>=2.1,<3",
    "markdownify>=1.0,<2",
    # markdownify already pulls this in, but the fallback extractor imports it
    # directly to drop <script> and <style> elements before conversion, so it is
    # declared rather than borrowed.
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
# Post 18's optional provider-backed summarizer. The server runs, and the whole
# test suite passes, without this installed and without an API key.
provider = [
    "anthropic>=0.60",
]

[project.scripts]
mcp-research-browser = "research_browser.__main__:main"

[tool.uv]
# The mcp pin above is a pre-release, and so is its transitive mcp-types pin.
# Without this, `uv lock` silently drops `prerelease-mode = "allow"` from
# uv.lock, and the next `uv sync` on a clean machine fails to resolve.
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_browser"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
