[project]
name = "mcp-auth-demo"
version = "0.1.0"
description = "The OAuth 2.1 resource server and the toy authorization server behind post 20 of the series"
readme = "README.md"
requires-python = ">=3.10"

# Pinned exactly. Every response quoted in post 20 was produced by this version,
# and the WWW-Authenticate header text is a detail the SDK is free to change
# between releases. Floating the pin would quietly make the post wrong; failing
# a test is the outcome we want instead.
dependencies = [
    "mcp[cli]==2.0.0b2",
    "pyjwt>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
mcp-auth-demo = "auth_demo.__main__:main"
mcp-toy-as = "toy_as.__main__:main"

[tool.uv]
# The mcp pin above is a pre-release, and so is its transitive mcp-types pin.
# Without this, `uv lock` silently drops `prerelease-mode = "allow"` from
# uv.lock, and the next `uv sync` on a clean machine fails to resolve.
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auth_demo", "src/toy_as"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
]
