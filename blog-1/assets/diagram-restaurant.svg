<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450">
  <style>
    .title { font: bold 22px sans-serif; fill: #333; }
    .subtitle { font: 16px sans-serif; fill: #666; }
    .label { font: bold 14px sans-serif; fill: #333; }
    .desc { font: 12px sans-serif; fill: #666; }
    .customer { fill: #8b5cf6; }
    .waiter { fill: #3b82f6; }
    .menu { fill: #f59e0b; }
    .kitchen { fill: #22c55e; }
    .food { fill: #ef4444; }
    .icon-text { font: bold 24px sans-serif; fill: white; }
    .arrow { stroke: #94a3b8; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
  </style>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" class="title">The Restaurant Analogy for MCP</text>
  
  <!-- Row 1: Restaurant concepts -->
  <!-- Customer -->
  <circle cx="100" cy="140" r="45" class="customer"/>
  <text x="100" y="148" text-anchor="middle" class="icon-text">👤</text>
  <text x="100" y="210" text-anchor="middle" class="label">Customer</text>
  <text x="100" y="228" text-anchor="middle" class="desc">(You)</text>
  
  <!-- Arrow -->
  <path d="M 155 140 L 215 140" class="arrow"/>
  
  <!-- Waiter -->
  <circle cx="270" cy="140" r="45" class="waiter"/>
  <text x="270" y="148" text-anchor="middle" class="icon-text">🤵</text>
  <text x="270" y="210" text-anchor="middle" class="label">Waiter</text>
  <text x="270" y="228" text-anchor="middle" class="desc">(Takes order)</text>
  
  <!-- Arrow -->
  <path d="M 325 140 L 385 140" class="arrow"/>
  
  <!-- Menu -->
  <rect x="395" y="95" width="90" height="90" rx="10" class="menu"/>
  <text x="440" y="148" text-anchor="middle" class="icon-text">📋</text>
  <text x="440" y="210" text-anchor="middle" class="label">Menu</text>
  <text x="440" y="228" text-anchor="middle" class="desc">(What's available)</text>
  
  <!-- Arrow -->
  <path d="M 495 140 L 555 140" class="arrow"/>
  
  <!-- Kitchen -->
  <rect x="565" y="95" width="90" height="90" rx="10" class="kitchen"/>
  <text x="610" y="148" text-anchor="middle" class="icon-text">👨‍🍳</text>
  <text x="610" y="210" text-anchor="middle" class="label">Kitchen</text>
  <text x="610" y="228" text-anchor="middle" class="desc">(Prepares food)</text>
  
  <!-- Arrow -->
  <path d="M 665 140 L 725 140" class="arrow"/>
  
  <!-- Food -->
  <circle cx="780" cy="140" r="45" class="food"/>
  <text x="780" y="148" text-anchor="middle" class="icon-text">🍝</text>
  <text x="780" y="210" text-anchor="middle" class="label">Food</text>
  <text x="780" y="228" text-anchor="middle" class="desc">(Result)</text>
  
  <!-- Divider -->
  <line x1="50" y1="270" x2="850" y2="270" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="10,5"/>
  <text x="450" y="290" text-anchor="middle" class="subtitle">↓ MCP Equivalent ↓</text>
  
  <!-- Row 2: MCP concepts -->
  <!-- User -->
  <circle cx="100" cy="370" r="45" class="customer"/>
  <text x="100" y="378" text-anchor="middle" class="icon-text">💬</text>
  <text x="100" y="430" text-anchor="middle" class="label">User</text>
  
  <!-- Arrow -->
  <path d="M 155 370 L 215 370" class="arrow"/>
  
  <!-- MCP Client -->
  <circle cx="270" cy="370" r="45" class="waiter"/>
  <text x="270" y="378" text-anchor="middle" class="icon-text">🔌</text>
  <text x="270" y="430" text-anchor="middle" class="label">MCP Client</text>
  
  <!-- Arrow -->
  <path d="M 325 370 L 385 370" class="arrow"/>
  
  <!-- Tools/Resources -->
  <rect x="395" y="325" width="90" height="90" rx="10" class="menu"/>
  <text x="440" y="378" text-anchor="middle" class="icon-text">🔧</text>
  <text x="440" y="430" text-anchor="middle" class="label">Tools/Resources</text>
  
  <!-- Arrow -->
  <path d="M 495 370 L 555 370" class="arrow"/>
  
  <!-- MCP Server -->
  <rect x="565" y="325" width="90" height="90" rx="10" class="kitchen"/>
  <text x="610" y="378" text-anchor="middle" class="icon-text">⚙️</text>
  <text x="610" y="430" text-anchor="middle" class="label">MCP Server</text>
  
  <!-- Arrow -->
  <path d="M 665 370 L 725 370" class="arrow"/>
  
  <!-- Data -->
  <circle cx="780" cy="370" r="45" class="food"/>
  <text x="780" y="378" text-anchor="middle" class="icon-text">📊</text>
  <text x="780" y="430" text-anchor="middle" class="label">Data/Results</text>
</svg>
