<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #2c3e50; stroke-width: 2; }
      .computer-box { fill: #ecf0f1; stroke: #2c3e50; stroke-width: 3; }
      .text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; fill: #2c3e50; }
      .text-small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #7f8c8d; }
      .text-large { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; fill: #2c3e50; font-weight: bold; }
      .text-caption { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #7f8c8d; font-style: italic; }
      .arrow { stroke: #3498db; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #3498db; font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3498db" />
    </marker>
  </defs>
  
  <!-- Computer boundary -->
  <rect x="40" y="30" width="720" height="420" class="computer-box" rx="10"/>
  <text x="400" y="60" class="text-large" text-anchor="middle">YOUR COMPUTER</text>
  
  <!-- Claude Desktop -->
  <rect x="80" y="120" width="180" height="100" class="box" rx="5"/>
  <text x="170" y="155" class="text" text-anchor="middle" font-weight="bold">Claude Desktop</text>
  <text x="170" y="180" class="text-small" text-anchor="middle">(the AI app)</text>
  
  <!-- MCP Server -->
  <rect x="380" y="120" width="180" height="100" class="box" rx="5"/>
  <text x="470" y="155" class="text" text-anchor="middle" font-weight="bold">MCP Server</text>
  <text x="470" y="180" class="text-small" text-anchor="middle">(Python script)</text>
  
  <!-- Database -->
  <rect x="380" y="300" width="180" height="100" class="box" rx="5"/>
  <text x="470" y="335" class="text" text-anchor="middle" font-weight="bold">Your Database</text>
  <text x="470" y="360" class="text-small" text-anchor="middle">(localhost:5432)</text>
  
  <!-- Arrow: Claude ↔ MCP Server -->
  <line x1="260" y1="150" x2="360" y2="150" class="arrow"/>
  <line x1="360" y1="190" x2="260" y2="190" class="arrow"/>
  <text x="310" y="140" class="arrow-label" text-anchor="middle">STDIO</text>
  
  <!-- Arrow: MCP Server → Database -->
  <line x1="470" y1="220" x2="470" y2="280" class="arrow"/>
  
  <!-- Bottom caption -->
  <text x="400" y="440" class="text-caption" text-anchor="middle">Everything runs here. Data never leaves.</text>
</svg>
