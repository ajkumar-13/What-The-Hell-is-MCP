<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <style>
    .title { font: bold 20px sans-serif; fill: #333; }
    .label { font: 14px sans-serif; fill: #333; }
    .ai-box { fill: #6366f1; rx: 8; }
    .data-box { fill: #22c55e; rx: 8; }
    .mcp-box { fill: #f59e0b; rx: 12; }
    .line { stroke: #6366f1; stroke-width: 3; }
    .line-right { stroke: #22c55e; stroke-width: 3; }
    .box-text { font: bold 14px sans-serif; fill: white; }
    .mcp-text { font: bold 18px sans-serif; fill: white; }
  </style>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">After MCP: Clean N+M Architecture</text>
  
  <!-- AI Tools (Left Side) -->
  <rect x="50" y="120" width="120" height="50" class="ai-box"/>
  <text x="110" y="150" text-anchor="middle" class="box-text">Claude</text>
  
  <rect x="50" y="200" width="120" height="50" class="ai-box"/>
  <text x="110" y="230" text-anchor="middle" class="box-text">ChatGPT</text>
  
  <rect x="50" y="280" width="120" height="50" class="ai-box"/>
  <text x="110" y="310" text-anchor="middle" class="box-text">Cursor IDE</text>
  
  <!-- MCP Protocol (Center) -->
  <rect x="300" y="100" width="200" height="250" class="mcp-box"/>
  <text x="400" y="230" text-anchor="middle" class="mcp-text">MCP</text>
  <text x="400" y="255" text-anchor="middle" class="box-text">Protocol</text>
  
  <!-- Data Sources (Right Side) -->
  <rect x="630" y="80" width="120" height="40" class="data-box"/>
  <text x="690" y="105" text-anchor="middle" class="box-text">PostgreSQL</text>
  
  <rect x="630" y="140" width="120" height="40" class="data-box"/>
  <text x="690" y="165" text-anchor="middle" class="box-text">Slack</text>
  
  <rect x="630" y="200" width="120" height="40" class="data-box"/>
  <text x="690" y="225" text-anchor="middle" class="box-text">GitHub</text>
  
  <rect x="630" y="260" width="120" height="40" class="data-box"/>
  <text x="690" y="285" text-anchor="middle" class="box-text">Jira</text>
  
  <rect x="630" y="320" width="120" height="40" class="data-box"/>
  <text x="690" y="345" text-anchor="middle" class="box-text">AWS S3</text>
  
  <!-- Connection Lines from AI to MCP -->
  <line x1="170" y1="145" x2="300" y2="200" class="line"/>
  <line x1="170" y1="225" x2="300" y2="225" class="line"/>
  <line x1="170" y1="305" x2="300" y2="250" class="line"/>
  
  <!-- Connection Lines from MCP to Data -->
  <line x1="500" y1="150" x2="630" y2="100" class="line-right"/>
  <line x1="500" y1="180" x2="630" y2="160" class="line-right"/>
  <line x1="500" y1="220" x2="630" y2="220" class="line-right"/>
  <line x1="500" y1="260" x2="630" y2="280" class="line-right"/>
  <line x1="500" y1="300" x2="630" y2="340" class="line-right"/>
  
  <!-- Labels -->
  <text x="110" y="380" text-anchor="middle" class="label">3 MCP Clients</text>
  <text x="400" y="380" text-anchor="middle" class="label">Standard Protocol</text>
  <text x="690" y="390" text-anchor="middle" class="label">5 MCP Servers</text>
  
  <!-- Math -->
  <text x="400" y="430" text-anchor="middle" class="title" style="fill: #22c55e;">3 + 5 = 8 Integrations!</text>
  <text x="400" y="460" text-anchor="middle" class="label">One standard, any AI tool works with any data source</text>
</svg>
