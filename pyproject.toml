[project]
name = "mcp-series"
version = "1.0.0"
description = "The environment the posts' snippets of What The Hell is MCP? run in: the pinned SDK and the two libraries the snippets import"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]==2.3.0",
    "psutil>=7.0.0",
    "httpx<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pyyaml>=6.0",
]

[tool.uv]
# Kept from the pre-release era; harmless now that the pin is a stable release.
prerelease = "allow"

[tool.pytest.ini_options]
asyncio_mode = "auto"
