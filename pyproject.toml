[project]
name = "mcp-series"
version = "1.0.0"
description = "The environment the posts' snippets of What The Hell is MCP? run in: the pinned SDK and the two libraries the snippets import"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]==2.0.0b2",
    "psutil>=7.0.0",
    "httpx<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pyyaml>=6.0",
]

[tool.uv]
# mcp==2.0.0b2 and its mcp-types pin are pre-releases; without this the lock drops them.
prerelease = "allow"

[tool.pytest.ini_options]
asyncio_mode = "auto"
