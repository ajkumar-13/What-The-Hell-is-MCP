<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="claudeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BBDEFB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8E6C9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="systemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF3E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE0B2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="#F5F7FA"/>
  
  <!-- Title -->
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#37474F" text-anchor="middle">
    Local Architecture: Claude Desktop ↔ server.py ↔ System Stats
  </text>
  
  <!-- Computer Container -->
  <rect x="40" y="65" width="720" height="280" rx="15" fill="white" stroke="#90CAF9" stroke-width="2.5" stroke-dasharray="8,4" filter="url(#shadow)"/>
  <text x="400" y="92" font-family="Arial, sans-serif" font-size="14" fill="#546E7A" text-anchor="middle" font-weight="500">
    YOUR COMPUTER (Everything runs locally)
  </text>
  
  <!-- Claude Desktop Box -->
  <g transform="translate(70, 125)">
    <rect width="190" height="180" rx="12" fill="url(#claudeGrad)" stroke="#42A5F5" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="95" y="30" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1565C0" text-anchor="middle">
      Claude Desktop
    </text>
    <text x="95" y="52" font-family="Arial, sans-serif" font-size="12" fill="#37474F" text-anchor="middle">
      (MCP Host + Client)
    </text>
    
    <!-- Icon -->
    <circle cx="95" cy="95" r="28" fill="#2196F3" opacity="0.15"/>
    <path d="M 85 90 Q 95 80 105 90 L 105 100 Q 95 110 85 100 Z" fill="#1976D2"/>
    
    <rect x="25" y="135" width="140" height="30" rx="6" fill="white" opacity="0.7"/>
    <text x="95" y="152" font-family="Arial, sans-serif" font-size="11" fill="#455A64" text-anchor="middle">
      Sends JSON-RPC via
    </text>
    <text x="95" y="165" font-family="monospace" font-size="11" font-weight="700" fill="#1565C0" text-anchor="middle">
      stdin
    </text>
  </g>
  
  <!-- Server.py Box -->
  <g transform="translate(305, 125)">
    <rect width="190" height="180" rx="12" fill="url(#serverGrad)" stroke="#66BB6A" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="95" y="30" font-family="monospace" font-size="17" font-weight="700" fill="#2E7D32" text-anchor="middle">
      server.py
    </text>
    <text x="95" y="50" font-family="Arial, sans-serif" font-size="12" fill="#37474F" text-anchor="middle">
      (Your MCP Server)
    </text>
    
    <!-- Code snippet -->
    <rect x="18" y="68" width="154" height="72" rx="6" fill="white" opacity="0.8"/>
    <text x="28" y="88" font-family="monospace" font-size="10" fill="#2E7D32" font-weight="600">@app.call_tool()</text>
    <text x="28" y="103" font-family="monospace" font-size="10" fill="#546E7A">def get_info():</text>
    <text x="38" y="118" font-family="monospace" font-size="10" fill="#546E7A">  cpu = psutil</text>
    <text x="38" y="133" font-family="monospace" font-size="10" fill="#546E7A">    .cpu_percent()</text>
    
    <rect x="25" y="150" width="140" height="22" rx="6" fill="white" opacity="0.7"/>
    <text x="95" y="166" font-family="monospace" font-size="11" font-weight="700" fill="#2E7D32" text-anchor="middle">
      stdout → results
    </text>
  </g>
  
  <!-- System Stats Box -->
  <g transform="translate(540, 125)">
    <rect width="190" height="180" rx="12" fill="url(#systemGrad)" stroke="#FFA726" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="95" y="30" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#E65100" text-anchor="middle">
      System Stats
    </text>
    <text x="95" y="50" font-family="Arial, sans-serif" font-size="12" fill="#37474F" text-anchor="middle">
      (via psutil library)
    </text>
    
    <!-- Stats items -->
    <g transform="translate(25, 75)">
      <circle cx="18" cy="12" r="14" fill="#FF9800" opacity="0.2"/>
      <text x="18" y="17" font-family="Arial, sans-serif" font-size="11" fill="#E65100" text-anchor="middle" font-weight="700">CPU</text>
      <text x="45" y="17" font-family="monospace" font-size="11" fill="#455A64">cpu_percent()</text>
    </g>
    
    <g transform="translate(25, 115)">
      <circle cx="18" cy="12" r="14" fill="#FF9800" opacity="0.2"/>
      <text x="18" y="17" font-family="Arial, sans-serif" font-size="10" fill="#E65100" text-anchor="middle" font-weight="700">RAM</text>
      <text x="45" y="17" font-family="monospace" font-size="11" fill="#455A64">virtual_memory()</text>
    </g>
    
    <g transform="translate(25, 155)">
      <circle cx="18" cy="12" r="14" fill="#FF9800" opacity="0.2"/>
      <text x="18" y="17" font-family="Arial, sans-serif" font-size="10" fill="#E65100" text-anchor="middle" font-weight="700">DISK</text>
      <text x="45" y="17" font-family="monospace" font-size="11" fill="#455A64">disk_usage()</text>
    </g>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1976D2" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#388E3C" />
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F57C00" />
    </marker>
  </defs>
  
  <!-- STDIO Communication -->
  <path d="M 270 200 L 295 200" stroke="#1976D2" stroke-width="3.5" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 295 230 L 270 230" stroke="#388E3C" stroke-width="3.5" fill="none" marker-end="url(#arrowGreen)"/>
  
  <rect x="267" y="175" width="38" height="70" rx="8" fill="white" opacity="0.9" filter="url(#shadow)"/>
  <text x="286" y="192" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1565C0" text-anchor="middle">
    STDIO
  </text>
  <text x="286" y="210" font-family="monospace" font-size="9" fill="#37474F" text-anchor="middle">
    stdin →
  </text>
  <text x="286" y="222" font-family="monospace" font-size="9" fill="#37474F" text-anchor="middle">
    JSON-
  </text>
  <text x="286" y="234" font-family="monospace" font-size="9" fill="#37474F" text-anchor="middle">
    RPC
  </text>
  
  <!-- System access -->
  <path d="M 505 215 L 530 215" stroke="#F57C00" stroke-width="3" fill="none" marker-end="url(#arrowOrange)" stroke-dasharray="6,4"/>
  <text x="517" y="207" font-family="Arial, sans-serif" font-size="11" fill="#E65100" text-anchor="middle" font-weight="600">
    reads
  </text>
  
  <!-- Flow description box -->
  <rect x="50" y="365" width="700" height="70" rx="12" fill="white" stroke="#B0BEC5" stroke-width="2" filter="url(#shadow)"/>
  <text x="65" y="388" fill="#37474F" font-family="Arial, sans-serif" font-size="13" font-weight="700">The Flow:</text>
  <text x="75" y="408" fill="#546E7A" font-family="Arial, sans-serif" font-size="12">
    1. You ask Claude: "What's my CPU usage?"
  </text>
  <text x="75" y="425" fill="#546E7A" font-family="Arial, sans-serif" font-size="12">
    2. Claude → server.py (via STDIO) → psutil.cpu_percent() → Returns "45%" → Claude responds
  </text>
</svg>
