<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="300" fill="url(#bgGrad)" rx="12"/>
  
  <!-- Explorer window -->
  <rect x="15" y="10" width="470" height="275" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="15" y="10" width="470" height="32" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="15" y="32" width="470" height="10" fill="#f1f5f9"/>
  <text x="35" y="31" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">EXPLORER</text>
  
  <!-- Folder structure -->
  <g font-family="Consolas, Monaco, monospace" font-size="14">
    <!-- Root folder -->
    <text x="35" y="65" fill="#b45309">📁 mcp-system-info</text>
    
    <!-- pyproject.toml -->
    <text x="60" y="95" fill="#0369a1">📄 pyproject.toml</text>
    <text x="215" y="95" fill="#16a34a" font-size="11">← dependencies</text>
    
    <!-- src folder -->
    <text x="60" y="125" fill="#b45309">📁 src</text>
    
    <!-- server.py -->
    <text x="85" y="155" fill="#0369a1">🐍 server.py</text>
    <text x="215" y="155" fill="#16a34a" font-size="11">← your MCP server</text>
    
    <!-- .venv folder -->
    <text x="60" y="185" fill="#94a3b8">📁 .venv</text>
    <text x="215" y="185" fill="#16a34a" font-size="11">← created by uv</text>
    
    <!-- README -->
    <text x="60" y="215" fill="#0369a1">📄 README.md</text>
  </g>
  
  <!-- Hint box -->
  <rect x="30" y="240" width="440" height="35" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="45" y="262" fill="#16a34a" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">✓ If your folder looks like this, you're ready to continue!</text>
</svg>
