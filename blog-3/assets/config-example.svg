<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 380">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="650" height="380" fill="url(#bgGrad)" rx="12"/>
  
  <!-- Editor window -->
  <rect x="20" y="15" width="610" height="350" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="20" y="15" width="610" height="35" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="20" y="40" width="610" height="10" fill="#f1f5f9"/>
  
  <!-- Window controls -->
  <circle cx="45" cy="32" r="6" fill="#fca5a5"/>
  <circle cx="65" cy="32" r="6" fill="#fcd34d"/>
  <circle cx="85" cy="32" r="6" fill="#86efac"/>
  
  <!-- File name -->
  <text x="325" y="37" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">claude_desktop_config.json</text>
  
  <!-- JSON content with light-theme syntax highlighting -->
  <g font-family="Consolas, Monaco, monospace" font-size="13">
    <text x="40" y="75" fill="#64748b">{</text>
    <text x="55" y="100" fill="#0369a1">"mcpServers"</text><text x="150" y="100" fill="#64748b">: {</text>
    <text x="70" y="125" fill="#0369a1">"system-info"</text><text x="170" y="125" fill="#64748b">: {</text>
    
    <text x="85" y="150" fill="#0369a1">"command"</text><text x="160" y="150" fill="#64748b">:</text><text x="175" y="150" fill="#b45309">"uv"</text><text x="200" y="150" fill="#64748b">,</text>
    
    <text x="85" y="175" fill="#0369a1">"args"</text><text x="135" y="175" fill="#64748b">: [</text>
    <text x="100" y="200" fill="#b45309">"run"</text><text x="140" y="200" fill="#64748b">,</text>
    <text x="100" y="225" fill="#b45309">"--directory"</text><text x="195" y="225" fill="#64748b">,</text>
    <text x="100" y="250" fill="#b45309">"C:\\Users\\YourName\\mcp-system-info"</text><text x="405" y="250" fill="#64748b">,</text>
    <text x="100" y="275" fill="#b45309">"python"</text><text x="165" y="275" fill="#64748b">,</text>
    <text x="100" y="300" fill="#b45309">"src/server.py"</text>
    <text x="85" y="325" fill="#64748b">]</text>
    
    <text x="70" y="340" fill="#64748b">}</text>
    <text x="55" y="355" fill="#64748b">}</text>
    <text x="40" y="363" fill="#64748b">}</text>
  </g>
  
  <!-- Warning callout -->
  <rect x="420" y="238" width="200" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="435" y="258" fill="#92400e" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">⚠️ Windows: Use \\ not \</text>
  <text x="435" y="275" fill="#a16207" font-family="Segoe UI, Arial, sans-serif" font-size="10">Double backslashes required!</text>
</svg>
